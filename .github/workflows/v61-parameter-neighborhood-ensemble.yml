name: v6.1 Parameter Neighborhood Ensemble

on:
  workflow_dispatch:
  push:
    branches:
      - research/v61-parameter-neighborhood-ensemble
  pull_request:
    branches:
      - research/v60-common-accounting-tournament

permissions:
  contents: read

jobs:
  ensemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_parameter_neighborhood_ensemble_v61.py \
            tests/test_champion_chronology_audit_v603.py \
            tests/test_champion_statistical_gates_v602.py

      - name: Full regression suite
        run: python -m pytest -q

      - name: Reproduce frozen source reports
        run: |
          mkdir -p evidence/v61
          python -m tradebot.research.historical_yield_trend_integrity_v312 \
            --json-out evidence/v61/v312-binance.json \
            --max-workers 16
          python -m tradebot.research.historical_coinbase_replication_v32 \
            --json-out evidence/v61/v32-coinbase.json

      - name: Reproduce v6 dependencies
        run: |
          python -m tradebot.research.champion_robustness_v6011 \
            --v312-json evidence/v61/v312-binance.json \
            --v32-json evidence/v61/v32-coinbase.json \
            --json-out evidence/v61/champion-robustness-v6011.json
          python -m tradebot.research.common_accounting_tournament_v60 \
            --v312-json evidence/v61/v312-binance.json \
            --v32-json evidence/v61/v32-coinbase.json \
            --robustness-json evidence/v61/champion-robustness-v6011.json \
            --json-out evidence/v61/champion-screen.json
          python -m tradebot.research.champion_chronology_audit_v603 \
            --v312-json evidence/v61/v312-binance.json \
            --v32-json evidence/v61/v32-coinbase.json \
            --robustness-json evidence/v61/champion-robustness-v6011.json \
            --material-json evidence/v61/champion-screen.json \
            --json-out evidence/v61/champion-chronology-v603.json

      - name: Run fixed neighborhood ensemble
        run: |
          python -m tradebot.research.parameter_neighborhood_ensemble_v611 \
            --v312-json evidence/v61/v312-binance.json \
            --v32-json evidence/v61/v32-coinbase.json \
            --v603-json evidence/v61/champion-chronology-v603.json \
            --json-out evidence/v61/ensemble-v61.json

      - name: Verify evidence boundary and print result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('evidence/v61/ensemble-v61.json').read_text())
          assert report['paper_only'] is True
          assert report['authorizes_trading'] is False
          assert report['authorizes_continuous_paper'] is False
          assert report['retrospective_dates_exposed'] is True
          assert report['untouched_historical_dates'] is False
          assert report['member_count'] == 16
          print(json.dumps({
              'status': report['status'],
              'conservative': report['conservative'],
              'material_gates': report['material_gates'],
              'statistical_gates': report['statistical_gates'],
              'source_specific_bootstrap': report['source_specific_bootstrap'],
              'deflated_sharpe': report['deflated_sharpe'],
              'rank_stability': report['rank_stability'],
              'report_sha256': report['report_sha256'],
          }, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v61-ensemble-${{ github.run_id }}
          path: evidence/v61
          if-no-files-found: error
          retention-days: 90
