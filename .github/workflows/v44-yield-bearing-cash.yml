name: v4.4 Yield-Bearing Cash Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/V44_YIELD_BEARING_CASH_PROTOCOL.md"
      - "research/V441_YIELD_BEARING_CASH_IMPLEMENTATION_CONTRACT.md"
      - "src/tradebot/research/yield_bearing_cash_v44.py"
      - "src/tradebot/research/yield_bearing_cash_v44_reproduce.py"
      - "tests/test_yield_bearing_cash_v44.py"
      - "tests/test_yield_bearing_cash_v44_reproduce.py"
      - ".github/workflows/v44-yield-bearing-cash.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  verify-and-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile v4.3 and v4.4
        run: |
          python -m py_compile \
            src/tradebot/research/distributional_utility_v43.py \
            src/tradebot/research/yield_bearing_cash_v44.py \
            src/tradebot/research/yield_bearing_cash_v44_reproduce.py
      - name: Focused invariant tests
        run: |
          python -m pytest -q \
            tests/test_distributional_utility_v43.py \
            tests/test_yield_bearing_cash_v44.py \
            tests/test_yield_bearing_cash_v44_reproduce.py
      - name: Reproduce frozen v4.3 baseline
        run: |
          mkdir -p evidence/v43 evidence/v44
          tradebot-v43-distributional-utility \
            --json-out evidence/v43/historical.json \
            --bundle-out evidence/v43/bundle.joblib \
            --monthly-workers 8 \
            --metrics-workers 16
      - name: Run retrospective v4.4 accounting campaign
        run: |
          tradebot-v44-yield-cash \
            --baseline-json evidence/v43/historical.json \
            --bundle evidence/v43/bundle.joblib \
            --json-out evidence/v44/historical.json \
            --monthly-workers 8 \
            --metrics-workers 16
      - name: Validate evidence and safety boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path("evidence/v43/historical.json").read_text())
          report = json.loads(Path("evidence/v44/historical.json").read_text())
          evaluation = report["evaluation"]
          comparison = report["comparison_with_v43"]
          cash = report["cash_source"]
          reproduction = report["reproduction"]

          assert report["paper_only"] is True
          assert report["authorizes_trading"] is False
          assert report["authorizes_shadow_paper"] is True
          assert report["retrospective"] is True
          assert report["untouched_historical_dates"] is False
          assert reproduction["source_inventory_exact"] is True
          assert reproduction["dataset_metadata_exact"] is True
          assert reproduction["bundle_summary_exact"] is True
          assert reproduction["v43_evaluation_exact"] is True
          assert reproduction["v43_retrained_for_overlay"] is False
          assert comparison["actions_unchanged"] is True
          assert comparison["selected_assets_unchanged"] is True
          assert comparison["signal_or_risk_parameters_changed"] is False
          assert comparison["standard_return_uplift"] > 0.0
          assert comparison["stress_return_uplift"] > 0.0
          assert evaluation["cash_contribution"] > 0.0
          assert cash["observation_count"] >= 1000
          assert cash["first_date"] <= "2022-01-03"
          assert cash["last_date"] >= "2026-06-30"
          assert evaluation["status"] in {
              "RETROSPECTIVE_NOT_YET_BREAKTHROUGH",
              "RETROSPECTIVE_HISTORICAL_BREAKTHROUGH_PENDING_REPLICATION_AND_SMOKE",
          }
          assert baseline["evaluation"]["target_changing_actions"] == evaluation["target_changing_actions"]
          assert baseline["evaluation"]["selected_assets"] == evaluation["selected_assets"]

          summary = {
              "status": evaluation["status"],
              "standard_return": evaluation["aggregate_standard_return"],
              "stress_return": evaluation["aggregate_stress_return"],
              "annualized_standard_return": evaluation["annualized_standard_return"],
              "maximum_drawdown": evaluation["maximum_drawdown"],
              "cash_contribution": evaluation["cash_contribution"],
              "standard_return_uplift": comparison["standard_return_uplift"],
              "report_sha256": report["report_sha256"],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v44-yield-bearing-cash-${{ github.run_id }}
          path: |
            evidence/v43/historical.json
            evidence/v43/bundle.joblib
            evidence/v44/historical.json
          retention-days: 90
