name: v4.8 Dollar/Rates Exposure Attenuation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/V48_DOLLAR_RATES_ATTENUATION_PROTOCOL.md"
      - "research/V481_DOLLAR_RATES_ATTENUATION_IMPLEMENTATION_CONTRACT.md"
      - "src/tradebot/research/dollar_rates_attenuation_v48.py"
      - "tests/test_dollar_rates_attenuation_v48.py"
      - ".github/workflows/v48-dollar-rates-attenuation.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  verify-and-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile research modules
        run: |
          python -m py_compile \
            src/tradebot/research/distributional_utility_v43.py \
            src/tradebot/research/yield_bearing_cash_v44.py \
            src/tradebot/research/yield_bearing_cash_v44_reproduce.py \
            src/tradebot/research/walk_forward_selective_veto_v46.py \
            src/tradebot/research/macro_liquidity_state_v47.py \
            src/tradebot/research/macro_liquidity_state_v47_runner.py \
            src/tradebot/research/dollar_rates_attenuation_v48.py
      - name: Focused invariant tests
        run: |
          python -m pytest -q \
            tests/test_distributional_utility_v43.py \
            tests/test_yield_bearing_cash_v44.py \
            tests/test_yield_bearing_cash_v44_reproduce.py \
            tests/test_walk_forward_selective_veto_v46.py \
            tests/test_macro_liquidity_state_v47.py \
            tests/test_macro_liquidity_state_v47_runner.py \
            tests/test_dollar_rates_attenuation_v48.py
      - name: Reproduce final frozen v4.3 baseline
        run: |
          mkdir -p evidence/v43 evidence/v48
          tradebot-v43-distributional-utility \
            --json-out evidence/v43/historical.json \
            --bundle-out evidence/v43/bundle.joblib \
            --monthly-workers 8 \
            --metrics-workers 16
      - name: Run v4.8 attenuation selection and sealed evaluation
        run: |
          tradebot-v48-dollar-rates \
            --baseline-json evidence/v43/historical.json \
            --bundle evidence/v43/bundle.joblib \
            --json-out evidence/v48/historical.json \
            --monthly-workers 8 \
            --metrics-workers 16
      - name: Validate v4.8 evidence boundary
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          report = json.loads(Path("evidence/v48/historical.json").read_text())
          selection = report["selection"]
          evaluation = report["evaluation"]
          comparison = report["comparison_with_v44"]
          reproduction = report["reproduction"]
          macro_source = report["macro_source"]
          features = report["macro_features"]

          assert report["schema_version"] == "4.8-dollar-rates-attenuation"
          assert report["paper_only"] is True
          assert report["authorizes_trading"] is False
          assert report["authorizes_shadow_paper"] is True
          assert report["retrospective"] is True
          assert report["untouched_historical_dates"] is False
          assert reproduction["source_inventory_exact"] is True
          assert reproduction["dataset_metadata_exact"] is True
          assert reproduction["bundle_summary_exact"] is True
          assert reproduction["v43_evaluation_exact"] is True
          assert reproduction["walk_forward_fold_count"] == 6
          assert reproduction["active_multiplier_count"] == 3
          assert reproduction["final_v43_retrained_for_v48"] is False

          assert features["family"] == "dollar_rates"
          assert features["feature_names"] == [
              "dollar_change_5",
              "dollar_change_20",
              "dollar_change_60",
              "dgs10_level",
              "dgs10_change_5",
              "dgs10_change_20",
              "dgs10_change_60",
          ]
          assert features["attenuation_multipliers"] == [0.25, 0.5, 0.75]
          assert features["active_thresholds"] == [
              0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65
          ]
          assert features["availability_rule"] == (
              "newest observation dated <= decision date - 1 day"
          )
          assert set(macro_source["series"]) == {
              "VIXCLS", "DTWEXBGS", "DGS10", "NASDAQCOM"
          }
          assert macro_source["requested_start"] == "2022-01-01"
          assert macro_source["requested_end"] == "2026-06-30"
          for source in macro_source["series"].values():
              assert source["observation_count"] >= 900
              assert source["first_date"] <= "2022-01-03"
              assert source["last_date"] >= "2026-06-29"
              assert len(source["raw_sha256"]) == 64

          assert selection["candidate_count"] == 4
          assert len(selection["folds"]) == 6
          assert selection["selected_multiplier"] in {0.25, 0.5, 0.75, 1.0}
          candidates = {
              float(candidate["multiplier"]): candidate
              for candidate in selection["candidates"]
          }
          assert set(candidates) == {0.25, 0.5, 0.75, 1.0}
          disabled = candidates[1.0]
          assert disabled["eligible"] is True
          assert disabled["selection_key"] is None
          assert disabled["ineligibility_reasons"] == []

          eligible_active = []
          for multiplier in (0.25, 0.5, 0.75):
              candidate = candidates[multiplier]
              assert len(candidate["folds"]) == 6
              baseline_actions = sum(
                  int(fold["validation_baseline"]["target_changing_actions"])
                  for fold in candidate["folds"]
              )
              candidate_actions = sum(
                  int(fold["validation_attenuated"]["target_changing_actions"])
                  for fold in candidate["folds"]
              )
              baseline_turnover = sum(
                  float(fold["validation_baseline"]["turnover"])
                  for fold in candidate["folds"]
              )
              candidate_turnover = sum(
                  float(fold["validation_attenuated"]["turnover"])
                  for fold in candidate["folds"]
              )
              if candidate["eligible"]:
                  eligible_active.append(candidate)
                  assert candidate["ineligibility_reasons"] == []
                  assert candidate["selection_key"] is not None
                  assert candidate["compounded_excess"] > 0.0
                  assert candidate["positive_excess_fold_count"] >= 4
                  assert candidate["minimum_fold_excess"] >= -0.0025
                  assert candidate["attenuated_decision_count"] >= 1
                  assert candidate_actions <= baseline_actions
                  assert candidate_turnover <= baseline_turnover + 1e-12
                  for fold in candidate["folds"]:
                      assert (
                          float(fold["validation_attenuated"]["maximum_drawdown"])
                          <= float(fold["validation_baseline"]["maximum_drawdown"])
                          + 0.0025
                      )

          if eligible_active:
              expected = max(
                  eligible_active,
                  key=lambda candidate: candidate["selection_key"],
              )
              assert selection["selected_multiplier"] == expected["multiplier"]
              assert selection["selected_is_disabled_baseline"] is False
              assert selection["selected_key"] == expected["selection_key"]
          else:
              assert selection["selected_multiplier"] == 1.0
              assert selection["selected_is_disabled_baseline"] is True
              assert selection["selected_key"] is None

          assert evaluation["verification_days"] == 265
          assert evaluation["maximum_target_exposure"] <= 0.1000001
          assert evaluation["maximum_selected_cardinality"] <= 2
          assert evaluation["never_added_asset"] is True
          assert evaluation["never_increased_target"] is True
          assert comparison["actions_not_increased"] is True
          assert comparison["maximum_target_exposure_not_increased"] is True
          assert comparison["never_added_asset"] is True
          assert comparison["never_increased_target"] is True
          assert comparison["crypto_signal_or_risk_parameters_changed"] is False
          assert evaluation["status"] in {
              "RETROSPECTIVE_NOT_YET_BREAKTHROUGH",
              "RETROSPECTIVE_HISTORICAL_BREAKTHROUGH_PENDING_REPLICATION_AND_SMOKE",
          }

          if selection["selected_multiplier"] == 1.0:
              assert report["final_calibration"]["threshold"] is None
              assert evaluation["attenuated_decision_count"] == 0
              assert math.isclose(
                  comparison["standard_return_uplift"], 0.0, abs_tol=1e-15
              )
              assert math.isclose(
                  comparison["stress_return_uplift"], 0.0, abs_tol=1e-15
              )
              assert math.isclose(
                  comparison["annualized_return_uplift"], 0.0, abs_tol=1e-15
              )
          else:
              assert report["final_calibration"]["threshold"] in {
                  0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65
              }
              assert len(report["final_calibration"]["calibration_months"]) == 3

          print(json.dumps({
              "status": evaluation["status"],
              "selected_multiplier": selection["selected_multiplier"],
              "selected_threshold": report["final_calibration"]["threshold"],
              "standard_return": evaluation["aggregate_standard_return"],
              "stress_return": evaluation["aggregate_stress_return"],
              "annualized_standard_return": evaluation["annualized_standard_return"],
              "maximum_drawdown": evaluation["maximum_drawdown"],
              "standard_windows": evaluation["standard_window_returns"],
              "attenuated_decision_count": evaluation["attenuated_decision_count"],
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload v4.8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-dollar-rates-${{ github.run_id }}
          path: |
            evidence/v43/historical.json
            evidence/v43/bundle.joblib
            evidence/v48/historical.json
          retention-days: 90
