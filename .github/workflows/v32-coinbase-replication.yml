name: v3.2 Coinbase Exact-Model Replication

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/V32_COINBASE_EXACT_MODEL_REPLICATION_PROTOCOL.md"
      - "research/V32_EXECUTION_DEPENDENCY_ADDENDUM.md"
      - "src/tradebot/research/historical_coinbase_replication_v32.py"
      - "tests/test_historical_coinbase_replication_v32.py"
      - ".github/workflows/v32-coinbase-replication.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "research/V32_COINBASE_EXACT_MODEL_REPLICATION_PROTOCOL.md"
      - "research/V32_EXECUTION_DEPENDENCY_ADDENDUM.md"
      - "src/tradebot/research/historical_coinbase_replication_v32.py"
      - "tests/test_historical_coinbase_replication_v32.py"
      - ".github/workflows/v32-coinbase-replication.yml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: v32-coinbase-replication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-v32:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile v3.2
        run: python -m py_compile src/tradebot/research/historical_coinbase_replication_v32.py
      - name: Verify frozen campaigns and v3.1.2 are unchanged
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" -- \
            src/tradebot/research/forward_alpha_v25.py \
            src/tradebot/research/forward_alpha_v25_readiness.py \
            research/V25_HIGH_CONVICTION_ALPHA_PROTOCOL.md \
            src/tradebot/research/historical_yield_trend_v31.py \
            src/tradebot/research/historical_yield_trend_v31_runner.py \
            src/tradebot/research/historical_yield_trend_v311_transport.py \
            src/tradebot/research/historical_yield_trend_scheduled_execution_v312.py \
            src/tradebot/research/historical_yield_trend_integrity_v312.py \
            research/V31_YIELD_TREND_OVERLAY_PROTOCOL.md \
            research/V31_SOURCE_AVAILABILITY_ADDENDUM.md \
            research/V311_FEDERAL_RESERVE_H15_TRANSPORT_ADDENDUM.md \
            research/V312_SCHEDULED_REBALANCE_INTEGRITY_ADDENDUM.md \
            src/tradebot/backtest/profit_quality_gate.py \
            src/tradebot/backtest/selection_stability.py
      - name: Run focused corrected v3.2 tests
        run: python -m pytest tests/test_historical_coinbase_replication_v32.py -q
      - name: Run complete repository suite
        run: python -m pytest -q
      - name: Enforce exact-model scheduled-execution boundary
        shell: bash
        run: |
          grep -q 'MODE = "HISTORICAL_COINBASE_EXACT_MODEL_REPLICATION_ONLY"' \
            src/tradebot/research/historical_coinbase_replication_v32.py
          grep -q 'EXPECTED_MODEL_ID = "sma100-rebalance10-top1-exposure10-vol2-brake20"' \
            src/tradebot/research/historical_coinbase_replication_v32.py
          grep -q '90dea7bcc12274146f730ba5a5cd9f93179ff944211ff07de849aca68e468c22' \
            src/tradebot/research/historical_coinbase_replication_v32.py
          grep -q 'execution.simulate_scheduled' \
            src/tradebot/research/historical_coinbase_replication_v32.py
          grep -q 'CHUNK_DAYS = 250' \
            src/tradebot/research/historical_coinbase_replication_v32.py
          ! grep -q 'v31.simulate(' \
            src/tradebot/research/historical_coinbase_replication_v32.py
          ! grep -q 'forward-data/v2' \
            src/tradebot/research/historical_coinbase_replication_v32.py
          ! grep -Eiq '(private_key|api_secret|withdraw|place_order|create_order)' \
            src/tradebot/research/historical_coinbase_replication_v32.py

  run-fixed-v32:
    if: github.event_name != 'pull_request'
    needs: verify-v32
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run corrected frozen v3.2 replication
        run: |
          mkdir -p evidence/v32-coinbase-replication
          tradebot-v32-coinbase-replication \
            --json-out evidence/v32-coinbase-replication/report.json
      - name: Validate deterministic five-year report
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report = json.loads(Path(
              "evidence/v32-coinbase-replication/report.json"
          ).read_text(encoding="utf-8"))
          assert report["schema_version"] == "3.2-coinbase-exact-replication"
          assert report["mode"] == "HISTORICAL_COINBASE_EXACT_MODEL_REPLICATION_ONLY"
          assert report["paper_only"] is True
          assert report["authorizes_trading"] is False
          assert report["authorizes_shadow_paper"] is False
          assert report["changes_track_a"] is False
          assert report["cannot_replace_forward_evidence"] is True
          assert report["price_provider"] == "coinbase-exchange-public-rest"
          assert report["execution_policy"] == (
              "daily_risk_exit_entry_or_due_rebalance_only_natural_drift"
          )
          assert report["v312_dependency_report_sha256"] == (
              "90dea7bcc12274146f730ba5a5cd9f93179ff944211ff07de849aca68e468c22"
          )
          assert report["frozen_model"]["model_id"] == (
              "sma100-rebalance10-top1-exposure10-vol2-brake20"
          )
          assert report["frozen_model"]["maximum_exposure"] == 0.10
          assert [item["name"] for item in report["verification_periods"]] == [
              "2021", "2022", "2023", "2024", "2025"
          ]
          coinbase = [
              item for item in report["source_inventory"]
              if item["provider"] == "coinbase-exchange-public-rest"
          ]
          assert len(coinbase) == 18
          assert {item["product"] for item in coinbase} == {"BTC-USD", "ETH-USD"}
          assert all(item["rows"] > 0 for item in coinbase)
          assert report["source_inventory_sha256"]
          assert report["fingerprints"]["protocol_sha256"]
          assert report["fingerprints"]["dependency_addendum_sha256"]
          assert report["fingerprints"]["implementation_sha256"]
          assert report["fingerprints"]["scheduled_execution_sha256"]
          assert report["fingerprints"]["v31_engine_sha256"]
          assert report["fingerprints"]["cash_transport_sha256"]
          assert report["fingerprints"]["frozen_model_sha256"]
          canonical = dict(report)
          expected = canonical.pop("report_sha256")
          encoded = json.dumps(
              canonical,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == expected
          print(json.dumps({
              "status": report["screening_status"],
              "standard_return": report["standard"]["net_compounded_return"],
              "stress_return": report["stress"]["net_compounded_return"],
              "cash_return": report["standard"]["cash_benchmark_compounded_return"],
              "standard_years": report["standard"]["window_returns"],
              "stress_years": report["stress"]["window_returns"],
              "standard_excess_years": report["standard"]["excess_window_returns"],
              "stress_excess_years": report["stress"]["excess_window_returns"],
              "action_days": report["standard"]["window_action_days"],
              "gates": report["gates"],
              "maximum_drawdown": report["standard"]["maximum_drawdown"],
              "report_sha256": expected,
          }, indent=2, sort_keys=True))
          PY
      - name: Persist immutable v3.2 result
        shell: bash
        run: |
          git fetch origin historical-results/v32
          git worktree add result-branch origin/historical-results/v32
          mkdir -p result-branch/results
          cp evidence/v32-coinbase-replication/report.json result-branch/results/latest.json
          cp evidence/v32-coinbase-replication/report.json \
            "result-branch/results/run-${GITHUB_RUN_ID}.json"
          cd result-branch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/latest.json "results/run-${GITHUB_RUN_ID}.json"
          git commit -m "Append corrected v3.2 Coinbase result ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin historical-results/v32
            git rebase origin/historical-results/v32
            if git push origin HEAD:historical-results/v32; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload corrected v3.2 report
        uses: actions/upload-artifact@v4
        with:
          name: v32-coinbase-replication-${{ github.run_id }}
          path: evidence/v32-coinbase-replication/report.json
          retention-days: 90
          if-no-files-found: error
