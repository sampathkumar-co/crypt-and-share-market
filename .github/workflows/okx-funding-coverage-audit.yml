name: Hyperliquid Funding Coverage Audit

on:
  pull_request:
    paths:
      - ".github/workflows/okx-funding-coverage-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit public Hyperliquid funding coverage only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen

          endpoint = "https://api.hyperliquid.xyz/info"
          coins = ["LTC", "BCH", "LINK", "XLM", "ETC", "ATOM", "UNI", "AAVE"]
          start = int(datetime(2025, 5, 27, tzinfo=timezone.utc).timestamp() * 1000)
          start_end = int(datetime(2025, 6, 10, tzinfo=timezone.utc).timestamp() * 1000)
          end_start = int(datetime(2026, 5, 7, tzinfo=timezone.utc).timestamp() * 1000)
          end = int(datetime(2026, 5, 22, tzinfo=timezone.utc).timestamp() * 1000) - 1

          def post(body):
              request = Request(
                  endpoint,
                  data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type": "application/json", "Accept": "application/json", "User-Agent": "crypt-and-share-market-coverage-audit/1.0"},
                  method="POST",
              )
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          meta = post({"type": "meta"})
          universe = {item["name"] for item in meta.get("universe", [])}
          report = []
          for coin in coins:
              listed = coin in universe
              early_rows = post({"type": "fundingHistory", "coin": coin, "startTime": start, "endTime": start_end}) if listed else []
              late_rows = post({"type": "fundingHistory", "coin": coin, "startTime": end_start, "endTime": end}) if listed else []
              all_rows = early_rows + late_rows
              times = [int(row["time"]) for row in all_rows]
              item = {
                  "coin": coin,
                  "listed": listed,
                  "early_records": len(early_rows),
                  "late_records": len(late_rows),
                  "earliest_observed": datetime.fromtimestamp(min(times) / 1000, timezone.utc).isoformat() if times else None,
                  "latest_observed": datetime.fromtimestamp(max(times) / 1000, timezone.utc).isoformat() if times else None,
                  "covers_required_windows": listed and bool(early_rows) and bool(late_rows),
              }
              report.append(item)
              print(json.dumps(item, sort_keys=True))

          if not all(item["covers_required_windows"] for item in report):
              missing = [item["coin"] for item in report if not item["covers_required_windows"]]
              raise SystemExit(f"Insufficient Hyperliquid funding coverage: {missing}")
          Path("funding_coverage.json").write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          PY

      - name: Upload coverage metadata
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-funding-coverage-audit
          path: funding_coverage.json
          retention-days: 7
