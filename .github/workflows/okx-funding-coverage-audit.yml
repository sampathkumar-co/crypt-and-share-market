name: Bitget Funding Coverage Audit

on:
  pull_request:
    paths:
      - ".github/workflows/okx-funding-coverage-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit public Bitget funding coverage only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          endpoint = "https://api.bitget.com/api/v2/mix/market/history-fund-rate"
          symbols = ["LTCUSDT", "BCHUSDT", "LINKUSDT", "XLMUSDT", "ETCUSDT", "ATOMUSDT", "UNIUSDT", "AAVEUSDT"]
          required = int(datetime(2025, 5, 27, tzinfo=timezone.utc).timestamp() * 1000)
          report = []

          def fetch(symbol, page):
              params = {
                  "symbol": symbol,
                  "productType": "usdt-futures",
                  "pageSize": "100",
                  "pageNo": str(page),
              }
              url = endpoint + "?" + urlencode(params)
              request = Request(url, headers={"Accept": "application/json", "User-Agent": "crypt-and-share-market-coverage-audit/1.0"})
              with urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("code") != "00000":
                  raise RuntimeError(f"Bitget error for {symbol}: {payload.get('code')} {payload.get('msg')}")
              data = payload.get("data", [])
              if isinstance(data, dict):
                  data = data.get("resultList", [])
              return data

          for symbol in symbols:
              earliest = None
              latest = None
              records = 0
              for page in range(1, 31):
                  rows = fetch(symbol, page)
                  if not rows:
                      break
                  stamps = [int(row.get("fundingTime") or row.get("fundingRateTimestamp")) for row in rows]
                  page_earliest = min(stamps)
                  page_latest = max(stamps)
                  earliest = page_earliest if earliest is None else min(earliest, page_earliest)
                  latest = page_latest if latest is None else max(latest, page_latest)
                  records += len(rows)
                  if earliest <= required:
                      break
                  time.sleep(0.05)
              if earliest is None or latest is None:
                  raise RuntimeError(f"No Bitget funding data for {symbol}")
              item = {
                  "symbol": symbol,
                  "records_scanned": records,
                  "earliest": datetime.fromtimestamp(earliest / 1000, timezone.utc).isoformat(),
                  "latest": datetime.fromtimestamp(latest / 1000, timezone.utc).isoformat(),
                  "covers_required_start": earliest <= required,
              }
              report.append(item)
              print(json.dumps(item, sort_keys=True))

          if not all(item["covers_required_start"] for item in report):
              missing = [item["symbol"] for item in report if not item["covers_required_start"]]
              raise SystemExit(f"Insufficient Bitget funding coverage: {missing}")
          Path("funding_coverage.json").write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          PY

      - name: Upload coverage metadata
        uses: actions/upload-artifact@v4
        with:
          name: bitget-funding-coverage-audit
          path: funding_coverage.json
          retention-days: 7
