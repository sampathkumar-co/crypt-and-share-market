name: OKX Funding Coverage Audit

on:
  push:
    branches:
      - research/v1.3.1-okx-coverage-audit
    paths:
      - ".github/workflows/okx-funding-coverage-audit.yml"
  pull_request:
    paths:
      - ".github/workflows/okx-funding-coverage-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit public OKX funding coverage only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          endpoint = "https://www.okx.com/api/v5/public/funding-rate-history"
          instruments = [
              "LTC-USDT-SWAP",
              "BCH-USDT-SWAP",
              "LINK-USDT-SWAP",
              "XLM-USDT-SWAP",
              "ETC-USDT-SWAP",
              "ATOM-USDT-SWAP",
              "UNI-USDT-SWAP",
              "AAVE-USDT-SWAP",
          ]
          required = int(datetime(2025, 5, 27, tzinfo=timezone.utc).timestamp() * 1000)
          report = []

          def fetch(params):
              url = endpoint + "?" + urlencode(params)
              request = Request(url, headers={"Accept": "application/json", "User-Agent": "crypt-and-share-market-coverage-audit/1.0"})
              with urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("code") != "0":
                  raise RuntimeError(f"OKX error: {payload.get('code')} {payload.get('msg')}")
              return payload.get("data", [])

          for instrument in instruments:
              earliest = None
              latest = None
              records = 0
              after = None
              for page in range(30):
                  params = {"instId": instrument, "limit": "100"}
                  if after is not None:
                      params["after"] = str(after)
                  rows = fetch(params)
                  if not rows:
                      break
                  stamps = [int(row["fundingTime"]) for row in rows]
                  page_earliest = min(stamps)
                  page_latest = max(stamps)
                  earliest = page_earliest if earliest is None else min(earliest, page_earliest)
                  latest = page_latest if latest is None else max(latest, page_latest)
                  records += len(rows)
                  if earliest <= required:
                      break
                  if after is not None and page_earliest >= after:
                      raise RuntimeError(f"Pagination did not advance for {instrument}")
                  after = page_earliest
                  time.sleep(0.05)
              if earliest is None or latest is None:
                  raise RuntimeError(f"No OKX funding data for {instrument}")
              item = {
                  "instrument": instrument,
                  "records_scanned": records,
                  "earliest": datetime.fromtimestamp(earliest / 1000, timezone.utc).isoformat(),
                  "latest": datetime.fromtimestamp(latest / 1000, timezone.utc).isoformat(),
                  "covers_required_start": earliest <= required,
              }
              report.append(item)
              print(json.dumps(item, sort_keys=True))

          if not all(item["covers_required_start"] for item in report):
              missing = [item["instrument"] for item in report if not item["covers_required_start"]]
              raise SystemExit(f"Insufficient OKX funding coverage: {missing}")
          Path("okx_funding_coverage.json").write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          PY

      - name: Upload coverage metadata
        uses: actions/upload-artifact@v4
        with:
          name: okx-funding-coverage-audit
          path: okx_funding_coverage.json
          retention-days: 7
