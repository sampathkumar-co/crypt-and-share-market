name: v3.1.1 Yield-Bearing Cash Trend Overlay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/V31_YIELD_TREND_OVERLAY_PROTOCOL.md"
      - "research/V31_SOURCE_AVAILABILITY_ADDENDUM.md"
      - "research/V311_FEDERAL_RESERVE_H15_TRANSPORT_ADDENDUM.md"
      - "src/tradebot/research/historical_yield_trend_v31.py"
      - "src/tradebot/research/historical_yield_trend_v31_runner.py"
      - "src/tradebot/research/historical_yield_trend_v311_transport.py"
      - "tests/test_historical_yield_trend_v31.py"
      - "tests/test_historical_yield_trend_v31_accounting.py"
      - "tests/test_historical_yield_trend_v31_transport.py"
      - ".github/workflows/v31-yield-trend-overlay.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "research/V311_FEDERAL_RESERVE_H15_TRANSPORT_ADDENDUM.md"
      - "src/tradebot/research/historical_yield_trend_v31_runner.py"
      - "src/tradebot/research/historical_yield_trend_v311_transport.py"
      - "tests/test_historical_yield_trend_v31_transport.py"
      - ".github/workflows/v31-yield-trend-overlay.yml"

permissions:
  contents: read

concurrency:
  group: v311-yield-trend-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-v31:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile v3.1.1
        run: |
          python -m py_compile src/tradebot/research/historical_yield_trend_v31.py
          python -m py_compile src/tradebot/research/historical_yield_trend_v31_runner.py
          python -m py_compile src/tradebot/research/historical_yield_trend_v311_transport.py
      - name: Verify frozen campaigns and gates are unchanged
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" -- \
            src/tradebot/research/forward_alpha_v25.py \
            src/tradebot/research/forward_alpha_v25_readiness.py \
            research/V25_HIGH_CONVICTION_ALPHA_PROTOCOL.md \
            src/tradebot/research/historical_proxy_screen_v25.py \
            research/V25_HISTORICAL_PROXY_SCREEN_PROTOCOL.md \
            src/tradebot/research/historical_discovery_v26.py \
            research/V26_COST_AWARE_HISTORICAL_DISCOVERY_PROTOCOL.md \
            src/tradebot/research/historical_discovery_v27.py \
            src/tradebot/research/historical_discovery_v27_runner.py \
            research/V27_FIVEFOLD_MECHANISM_DISCOVERY_PROTOCOL.md \
            src/tradebot/research/historical_rotation_v28.py \
            src/tradebot/research/historical_rotation_v28_runner.py \
            research/V28_REGIME_ADAPTIVE_ROTATION_PROTOCOL.md \
            src/tradebot/research/historical_trend_rotation_v29.py \
            research/V29_RISK_SCALED_TREND_ROTATION_PROTOCOL.md \
            src/tradebot/research/historical_monthly_ensemble_v30.py \
            src/tradebot/research/historical_monthly_ensemble_v30_runner.py \
            research/V30_MONTHLY_TREND_RECOVERY_ENSEMBLE_PROTOCOL.md \
            src/tradebot/research/historical_yield_trend_v31.py \
            research/V31_YIELD_TREND_OVERLAY_PROTOCOL.md \
            research/V31_SOURCE_AVAILABILITY_ADDENDUM.md \
            src/tradebot/backtest/profit_quality_gate.py \
            src/tradebot/backtest/selection_stability.py
      - name: Run focused v3.1.1 tests
        run: |
          python -m pytest \
            tests/test_historical_yield_trend_v31.py \
            tests/test_historical_yield_trend_v31_accounting.py \
            tests/test_historical_yield_trend_v31_transport.py -q
      - name: Run complete repository suite
        run: python -m pytest -q
      - name: Enforce isolated paper-only boundary
        shell: bash
        run: |
          grep -q 'MODE = "HISTORICAL_YIELD_TREND_OVERLAY_ONLY"' \
            src/tradebot/research/historical_yield_trend_v31.py
          grep -q 'if len(MODEL_GRID) != 64' \
            src/tradebot/research/historical_yield_trend_v31.py
          grep -q 'H15/H15/RIFLGFCM03_N.B' \
            src/tradebot/research/historical_yield_trend_v311_transport.py
          grep -q 'fred_once_each_then_federal_reserve_h15_package_twice' \
            src/tradebot/research/historical_yield_trend_v311_transport.py
          ! grep -q 'forward-data/v2' \
            src/tradebot/research/historical_yield_trend_v31_runner.py \
            src/tradebot/research/historical_yield_trend_v311_transport.py
          ! grep -Eiq '(private_key|api_secret|withdraw|place_order|create_order)' \
            src/tradebot/research/historical_yield_trend_v31.py \
            src/tradebot/research/historical_yield_trend_v31_runner.py \
            src/tradebot/research/historical_yield_trend_v311_transport.py

  run-fixed-v31:
    if: github.event_name != 'pull_request'
    needs: verify-v31
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run frozen v3.1.1 verification
        run: |
          mkdir -p evidence/v31-yield-trend
          tradebot-v31-yield-trend \
            --json-out evidence/v31-yield-trend/report.json \
            --max-workers 20
      - name: Validate deterministic five-year report
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("evidence/v31-yield-trend/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["schema_version"] == "3.1-yield-trend-overlay"
          assert report["mode"] == "HISTORICAL_YIELD_TREND_OVERLAY_ONLY"
          assert report["paper_only"] is True
          assert report["authorizes_trading"] is False
          assert report["authorizes_shadow_paper"] is False
          assert report["changes_track_a"] is False
          assert report["cannot_replace_forward_evidence"] is True
          assert report["model_grid_size"] == 64
          assert len(report["discovery_periods"]) == 10
          assert [item["name"] for item in report["verification_periods"]] == [
              "2021", "2022", "2023", "2024", "2025"
          ]
          assert report["cash_series"] == "DGS3MO"
          assert report["cash_source_policy"] == (
              "federal_reserve_h15_3_month_constant_maturity_exact_series"
          )
          assert report["cash_transport_policy"] == (
              "fred_once_each_then_federal_reserve_h15_package_twice"
          )
          assert report["transport_addendum_path"].endswith(
              "V311_FEDERAL_RESERVE_H15_TRANSPORT_ADDENDUM.md"
          )
          audit = report["cash_transport_audit"]
          assert audit["attempt_count"] >= 1
          assert audit["selected_url"] in audit["attempted_urls"]
          assert audit["selected_source"] in {
              "fred_dated_dgs3mo",
              "fred_full_dgs3mo",
              "federal_reserve_h15",
          }
          assert audit["series_id"] == "H15/H15/RIFLGFCM03_N.B"
          assert audit["raw_sha256"]
          assert audit["normalized_sha256"]
          assert audit["observation_count"] >= 2000
          assert audit["first_date"] == "2017-08-31"
          assert audit["last_date"] == "2025-12-31"
          assert report["fingerprints"]["protocol_sha256"]
          assert report["fingerprints"]["addendum_sha256"]
          assert report["fingerprints"]["runner_sha256"]
          assert report["fingerprints"]["cash_transport_sha256"]
          assert report["fingerprints"]["transport_addendum_sha256"]
          assert any(item["key"] == "cash:DGS3MO" for item in report["source_inventory"])
          canonical = dict(report)
          expected = canonical.pop("report_sha256")
          encoded = json.dumps(
              canonical,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == expected
          verification = report["verification"]
          print(json.dumps({
              "status": report["screening_status"],
              "chosen_model": report["chosen_model"],
              "discovery_gates": report["discovery"]["gates"],
              "standard_return": verification["standard"]["net_compounded_return"],
              "stress_return": verification["stress"]["net_compounded_return"],
              "cash_return": verification["standard"]["cash_benchmark_compounded_return"],
              "standard_years": verification["standard"]["window_returns"],
              "stress_years": verification["stress"]["window_returns"],
              "standard_excess_years": verification["standard"]["excess_window_returns"],
              "stress_excess_years": verification["stress"]["excess_window_returns"],
              "action_days": verification["standard"]["window_action_days"],
              "maximum_drawdown": verification["standard"]["maximum_drawdown"],
              "cash_transport_audit": audit,
              "report_sha256": expected,
          }, indent=2, sort_keys=True))
          PY
      - name: Persist immutable v3.1.1 result
        shell: bash
        run: |
          git fetch origin historical-results/v31
          git worktree add result-branch origin/historical-results/v31
          mkdir -p result-branch/results
          cp evidence/v31-yield-trend/report.json result-branch/results/latest.json
          cp evidence/v31-yield-trend/report.json \
            "result-branch/results/run-${GITHUB_RUN_ID}.json"
          cd result-branch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/latest.json "results/run-${GITHUB_RUN_ID}.json"
          git commit -m "Append v3.1.1 yield trend result ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin historical-results/v31
            git rebase origin/historical-results/v31
            if git push origin HEAD:historical-results/v31; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload v3.1.1 report
        uses: actions/upload-artifact@v4
        with:
          name: v311-yield-trend-${{ github.run_id }}
          path: evidence/v31-yield-trend/report.json
          retention-days: 90
          if-no-files-found: error
