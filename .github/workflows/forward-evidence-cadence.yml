name: Forward Evidence Cadence

on:
  workflow_dispatch:
  schedule:
    - cron: "5,25,45 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: forward-evidence-cadence
  cancel-in-progress: false

jobs:
  dispatch-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch fail-closed evidence watchdog when target hour is uncovered
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          target_hour_start=$(date -u +'%Y-%m-%dT%H:00:00Z')
          active=$(gh run list \
            --repo "$repo" \
            --workflow forward-evidence-watchdog.yml \
            --limit 20 \
            --json status,createdAt \
            --jq --arg target_hour_start "$target_hour_start" '[.[] | select((.status == "queued" or .status == "in_progress") and (.createdAt >= $target_hour_start))] | length')

          if [[ "$active" != "0" ]]; then
            echo "A watchdog created for the current target hour is already active; no duplicate dispatch is needed."
            exit 0
          fi

          gh workflow run forward-evidence-watchdog.yml \
            --repo "$repo" \
            --ref main
          echo "Dispatched the existing fail-closed watchdog for the current target hour; no evidence or strategy bytes were modified here."
