name: Forward Market State v2.0

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
    - cron: "17 * * * *"
    - cron: "27 * * * *"
    - cron: "37 * * * *"
    - cron: "47 * * * *"
  pull_request:
    paths:
      - ".github/workflows/forward-market-state-v20.yml"
      - "research/V20_FORWARD_MARKET_STATE_PROTOCOL.md"
      - "src/tradebot/data/forward_market_state.py"
      - "tests/test_forward_market_state.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: forward-market-state-v20-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_forward_market_state.py -q
          mkdir -p evidence/forward-market-state

      - name: Collect public forward snapshot
        run: |
          tradebot-forward-state \
            --out evidence/forward-market-state \
            --assets BTC,ETH,SOL,AVAX,LINK,DOGE \
            --external \
            --timeout 20 \
            --retries 3

      - name: Validate immutable evidence contract
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("evidence/forward-market-state")
          normalized = list((root / "normalized").glob("*.json"))
          manifests = list((root / "manifests").glob("*.json"))
          assert len(normalized) == 1, normalized
          assert len(manifests) == 1, manifests

          snapshot = json.loads(normalized[0].read_text(encoding="utf-8"))
          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          assert snapshot["schema_version"] == "2.0"
          assert snapshot["paper_only"] is True
          assert snapshot["authorizes_trading"] is False
          assert set(snapshot["assets"]) == {"BTC", "ETH", "SOL", "AVAX", "LINK", "DOGE"}
          assert snapshot["liquidation_events"]["available"] is False
          assert snapshot["liquidation_events"]["events"] == []
          assert snapshot["source_errors"] == {}, snapshot["source_errors"]

          for asset, record in snapshot["assets"].items():
              for family in ("spot_quote", "spot_book", "spot_trade_flow", "perp_state", "perp_book", "perp_trade_flow", "cross_venue"):
                  assert record[family]["available"] is True, (asset, family, record[family])
          assert snapshot["global"]["available"] is True, snapshot["global"]

          canonical = dict(snapshot)
          expected_record_sha = canonical.pop("record_sha256")
          encoded = json.dumps(canonical, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == expected_record_sha
          assert manifest["record_sha256"] == expected_record_sha
          assert manifest["normalized_file_sha256"] == hashlib.sha256(normalized[0].read_bytes()).hexdigest()
          assert len(manifest["sources"]) == 36, len(manifest["sources"])

          for source in manifest["sources"]:
              path = root / source["raw_path"]
              assert path.is_file(), path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == source["sha256"]
          print(json.dumps({
              "snapshot_id": snapshot["snapshot_id"],
              "record_sha256": expected_record_sha,
              "raw_sources": len(manifest["sources"]),
              "assets": sorted(snapshot["assets"]),
          }, indent=2))
          PY

      - name: Upload append-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: forward-market-state-v20-${{ github.run_id }}
          path: evidence/forward-market-state/
          retention-days: 90
          if-no-files-found: error

      - name: Upload normalized snapshot for router history
        uses: actions/upload-artifact@v4
        with:
          name: forward-market-state-v20-normalized-${{ github.run_id }}
          path: |
            evidence/forward-market-state/normalized/
            evidence/forward-market-state/manifests/
          retention-days: 90
          if-no-files-found: error
  persist-normalized-history:
    if: github.event_name != 'pull_request'
    needs: collect-and-verify
    runs-on: ubuntu-latest
    concurrency:
      group: forward-data-v2-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download compact snapshot evidence
        uses: actions/download-artifact@v4
        with:
          name: forward-market-state-v20-normalized-${{ github.run_id }}
          path: evidence/compact

      - name: Append normalized snapshot and manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin forward-data/v2
          rm -rf /tmp/forward-data-v2
          git worktree add --detach /tmp/forward-data-v2 origin/forward-data/v2
          for kind in normalized manifests; do
            mkdir -p "/tmp/forward-data-v2/data/forward-market-state/$kind"
            for source in "evidence/compact/$kind"/*.json; do
              target="/tmp/forward-data-v2/data/forward-market-state/$kind/$(basename "$source")"
              if [ -e "$target" ]; then
                cmp --silent "$source" "$target" || {
                  echo "Refusing to replace different append-only evidence: $target" >&2
                  exit 1
                }
              else
                cp "$source" "$target"
              fi
            done
          done
          git -C /tmp/forward-data-v2 config user.name "github-actions[bot]"
          git -C /tmp/forward-data-v2 config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/forward-data-v2 add data/forward-market-state
          if git -C /tmp/forward-data-v2 diff --cached --quiet; then
            echo "Snapshot already preserved byte-for-byte."
            exit 0
          fi
          snapshot_id=$(basename "$(find evidence/compact/normalized -name '*.json' -print -quit)" .json)
          git -C /tmp/forward-data-v2 commit -m "Append forward market-state snapshot $snapshot_id"
          git -C /tmp/forward-data-v2 push origin HEAD:forward-data/v2
