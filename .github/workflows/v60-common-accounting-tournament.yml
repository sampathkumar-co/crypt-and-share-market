name: v6 Common Accounting Tournament

on:
  workflow_dispatch:
  push:
    branches:
      - research/v60-common-accounting-tournament
  pull_request:
    branches:
      - research/v56-cost-aware-paper-execution

permissions:
  contents: read

jobs:
  champion-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_common_accounting_tournament_v60.py \
            tests/test_champion_robustness_v601.py \
            tests/test_champion_statistical_gates_v602.py \
            tests/test_champion_chronology_audit_v603.py

      - name: Full regression suite
        run: |
          python -m pytest -q

      - name: Reproduce corrected Binance champion
        run: |
          mkdir -p evidence/v60
          python -m tradebot.research.historical_yield_trend_integrity_v312 \
            --json-out evidence/v60/v312-binance.json \
            --max-workers 16

      - name: Reproduce independent Coinbase champion
        run: |
          python -m tradebot.research.historical_coinbase_replication_v32 \
            --json-out evidence/v60/v32-coinbase.json

      - name: Run preregistered delay and concentration diagnostics
        run: |
          python -m tradebot.research.champion_robustness_v6011 \
            --v312-json evidence/v60/v312-binance.json \
            --v32-json evidence/v60/v32-coinbase.json \
            --json-out evidence/v60/champion-robustness-v6011.json

      - name: Run conservative material-profit screen
        run: |
          python -m tradebot.research.common_accounting_tournament_v60 \
            --v312-json evidence/v60/v312-binance.json \
            --v32-json evidence/v60/v32-coinbase.json \
            --robustness-json evidence/v60/champion-robustness-v6011.json \
            --json-out evidence/v60/champion-screen.json

      - name: Preserve project-wide post-hoc statistical stress
        run: |
          python -m tradebot.research.champion_statistical_gates_v602 \
            --v312-json evidence/v60/v312-binance.json \
            --v32-json evidence/v60/v32-coinbase.json \
            --robustness-json evidence/v60/champion-robustness-v6011.json \
            --json-out evidence/v60/champion-statistics-v602.json

      - name: Run chronology-correct selection audit
        run: |
          python -m tradebot.research.champion_chronology_audit_v603 \
            --v312-json evidence/v60/v312-binance.json \
            --v32-json evidence/v60/v32-coinbase.json \
            --robustness-json evidence/v60/champion-robustness-v6011.json \
            --material-json evidence/v60/champion-screen.json \
            --json-out evidence/v60/champion-chronology-v603.json

      - name: Verify paper-only boundary and print results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          names = {
              'screen': 'champion-screen.json',
              'robustness': 'champion-robustness-v6011.json',
              'posthoc_statistics': 'champion-statistics-v602.json',
              'chronology_statistics': 'champion-chronology-v603.json',
          }
          reports = {
              key: json.loads((Path('evidence/v60') / filename).read_text())
              for key, filename in names.items()
          }
          for report in reports.values():
              assert report['paper_only'] is True
              assert report['authorizes_trading'] is False
              assert report['authorizes_continuous_paper'] is False
          assert reports['posthoc_statistics']['status'] == 'STATISTICAL_GATES_FAILED'
          assert reports['chronology_statistics']['preserves_v602_failure'] is True
          warmup = reports['robustness']['sources']['coinbase']['diagnostic_warmup_inventory']
          assert len(warmup) == 2
          print(json.dumps({
              'screen_status': reports['screen']['status'],
              'champion': reports['screen']['champion'],
              'robustness_status': reports['robustness']['status'],
              'posthoc_statistics_status': reports['posthoc_statistics']['status'],
              'chronology_statistics_status': reports['chronology_statistics']['status'],
              'chronology_gates': reports['chronology_statistics']['gates'],
              'source_specific_bootstrap': reports['chronology_statistics']['source_specific_bootstrap'],
              'deflated_sharpe': reports['chronology_statistics']['deflated_sharpe'],
              'corrected_grid_pbo': reports['chronology_statistics']['corrected_grid_pbo'],
              'frozen_model_corrected_rank': reports['chronology_statistics']['grid_reproduction']['frozen_model_corrected_discovery_sharpe_rank'],
              'report_sha256': {
                  key: report['report_sha256'] for key, report in reports.items()
              },
          }, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v60-common-accounting-${{ github.run_id }}
          path: evidence/v60
          if-no-files-found: error
          retention-days: 90
