name: v6 Common Accounting Tournament

on:
  workflow_dispatch:
  push:
    branches:
      - research/v60-common-accounting-tournament
  pull_request:
    branches:
      - research/v56-cost-aware-paper-execution

permissions:
  contents: read

jobs:
  champion-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_common_accounting_tournament_v60.py \
            tests/test_champion_robustness_v601.py \
            tests/test_champion_statistical_gates_v602.py

      - name: Full regression suite
        run: |
          python -m pytest -q

      - name: Reproduce corrected Binance champion
        run: |
          mkdir -p evidence/v60
          python -m tradebot.research.historical_yield_trend_integrity_v312 \
            --json-out evidence/v60/v312-binance.json \
            --max-workers 16

      - name: Reproduce independent Coinbase champion
        run: |
          python -m tradebot.research.historical_coinbase_replication_v32 \
            --json-out evidence/v60/v32-coinbase.json

      - name: Run preregistered delay and concentration diagnostics
        run: |
          python -m tradebot.research.champion_robustness_v6011 \
            --v312-json evidence/v60/v312-binance.json \
            --v32-json evidence/v60/v32-coinbase.json \
            --json-out evidence/v60/champion-robustness-v6011.json

      - name: Run conservative material-profit screen
        run: |
          python -m tradebot.research.common_accounting_tournament_v60 \
            --v312-json evidence/v60/v312-binance.json \
            --v32-json evidence/v60/v32-coinbase.json \
            --robustness-json evidence/v60/champion-robustness-v6011.json \
            --json-out evidence/v60/champion-screen.json

      - name: Run moving-block bootstrap and DSR floor
        run: |
          python -m tradebot.research.champion_statistical_gates_v602 \
            --v312-json evidence/v60/v312-binance.json \
            --v32-json evidence/v60/v32-coinbase.json \
            --robustness-json evidence/v60/champion-robustness-v6011.json \
            --json-out evidence/v60/champion-statistics-v602.json

      - name: Verify paper-only boundary and print results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          screen = json.loads(Path('evidence/v60/champion-screen.json').read_text())
          robustness = json.loads(Path('evidence/v60/champion-robustness-v6011.json').read_text())
          statistics = json.loads(Path('evidence/v60/champion-statistics-v602.json').read_text())
          for report in (screen, robustness, statistics):
              assert report['paper_only'] is True
              assert report['authorizes_trading'] is False
              assert report['authorizes_continuous_paper'] is False
          assert screen['historical_breakthrough'] is False
          assert statistics['historical_breakthrough'] is False
          warmup = robustness['sources']['coinbase']['diagnostic_warmup_inventory']
          assert len(warmup) == 2
          assert {item['requested_date'] for item in warmup} == {'2020-06-13'}
          print(json.dumps({
              'screen_status': screen['status'],
              'champion': screen['champion'],
              'failed_or_missing_material_gates': screen['failed_or_missing_material_gates'],
              'robustness_status': robustness['status'],
              'robustness_conservative': robustness['conservative'],
              'statistics_status': statistics['status'],
              'bootstrap': statistics['bootstrap'],
              'deflated_sharpe_floor': statistics['deflated_sharpe_floor'],
              'series': statistics['series'],
              'screen_report_sha256': screen['report_sha256'],
              'robustness_report_sha256': robustness['report_sha256'],
              'statistics_report_sha256': statistics['report_sha256'],
          }, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v60-common-accounting-${{ github.run_id }}
          path: evidence/v60
          if-no-files-found: error
          retention-days: 90
