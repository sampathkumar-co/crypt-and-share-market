name: Trigger First Forward Alpha v2.3 Decision

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/forward-alpha-v23-once.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frozen v2.3 decision workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "forward-alpha-decisions-v23.yml",
              ref: "main",
            });
            core.info("Dispatched Forward Alpha Decisions v2.3 on main.");
