name: Forward Evidence Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
    - cron: "37 * * * *"
    - cron: "57 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/triggers/forward-evidence-watchdog-once.txt"

permissions:
  contents: read
  actions: write

concurrency:
  group: forward-evidence-watchdog-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  recover-missing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inspect append-only evidence and dispatch only missing work
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin forward-data/v2
          rm -rf /tmp/forward-data-watchdog
          git worktree add --detach /tmp/forward-data-watchdog origin/forward-data/v2

          current_target=$(date -u +%Y-%m-%dT%H:00:00Z)
          phase="snapshot"
          if [[ "$EVENT_SCHEDULE" == "57 * * * *" ]]; then
            phase="decisions"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            phase="all"
          fi

          snapshot_present=$(TARGET="$current_target" python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = os.environ["TARGET"]
          found = False
          for path in Path("/tmp/forward-data-watchdog/data/forward-market-state/normalized").glob("*.json"):
              try:
                  if json.loads(path.read_text(encoding="utf-8")).get("hour_bucket_utc") == target:
                      found = True
                      break
              except (OSError, json.JSONDecodeError):
                  continue
          print("true" if found else "false")
          PY
          )

          current_hour_started_at=$(date -u +%Y-%m-%dT%H:00:00Z)
          current_minute=$((10#$(date -u +%M)))
          recovery_deadline_minute=45
          active_v20=$(gh run list --workflow forward-market-state-v20.yml --limit 10 --json status,createdAt \
            --jq "[.[] | select((.status == \"queued\" or .status == \"in_progress\") and .createdAt >= \"$current_hour_started_at\")] | length")

          dispatched_v20=false
          if [[ "$snapshot_present" != "true" && "$active_v20" == "0" && "$current_minute" -lt "$recovery_deadline_minute" ]]; then
            echo "Missing snapshot for $current_target with sufficient pre-rollover margin; dispatching frozen v2.0 collector."
            gh workflow run forward-market-state-v20.yml --ref main
            dispatched_v20=true
          elif [[ "$snapshot_present" != "true" && "$active_v20" == "0" ]]; then
            echo "Missing snapshot for $current_target, but minute=$current_minute is inside the rollover safety window; failing closed without dispatch." >&2
          else
            echo "Snapshot phase safe: target=$current_target present=$snapshot_present active_v20=$active_v20 phase=$phase minute=$current_minute"
          fi

          if [[ "$snapshot_present" != "true" && "$dispatched_v20" == "true" ]]; then
            echo "Waiting for the dispatched canonical snapshot before checking decisions."
            for attempt in $(seq 1 40); do
              sleep 15
              git fetch --quiet origin forward-data/v2
              git -C /tmp/forward-data-watchdog reset --hard --quiet origin/forward-data/v2
              snapshot_present=$(TARGET="$current_target" python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = os.environ["TARGET"]
          found = False
          for path in Path("/tmp/forward-data-watchdog/data/forward-market-state/normalized").glob("*.json"):
              try:
                  if json.loads(path.read_text(encoding="utf-8")).get("hour_bucket_utc") == target:
                      found = True
                      break
              except (OSError, json.JSONDecodeError):
                  continue
          print("true" if found else "false")
          PY
              )
              if [[ "$snapshot_present" == "true" ]]; then
                echo "Canonical snapshot persisted for $current_target; continuing inline to decision recovery."
                break
              fi
            done
          fi

          if [[ "$snapshot_present" != "true" ]]; then
            echo "Snapshot for $current_target is still unavailable; failing closed without dispatching decisions." >&2
            exit 1
          fi

          mapfile -t latest_info < <(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          captures = []
          root = Path("/tmp/forward-data-watchdog/data/forward-market-state/normalized")
          for path in root.glob("*.json"):
              try:
                  raw = json.loads(path.read_text(encoding="utf-8")).get("hour_bucket_utc")
                  parsed = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
              except (OSError, ValueError, TypeError, json.JSONDecodeError):
                  continue
              if parsed.tzinfo is None:
                  continue
              parsed = parsed.astimezone(timezone.utc)
              if parsed.minute or parsed.second or parsed.microsecond:
                  continue
              captures.append((parsed, path.name))
          if not captures:
              raise SystemExit("No canonical snapshot hour is available for decision recovery")
          latest_hour = max(item[0] for item in captures)
          canonical_name = min(name for hour, name in captures if hour == latest_hour)
          print(latest_hour.strftime("%Y-%m-%dT%H:00:00Z"))
          print(latest_hour.strftime("%Y%m%dT%H0000Z"))
          print(f"data/forward-market-state/normalized/{canonical_name}")
          PY
          )
          test "${#latest_info[@]}" -eq 3
          target="${latest_info[0]}"
          safe="${latest_info[1]}"
          canonical_snapshot_path="${latest_info[2]}"
          snapshot_persisted_at=$(git -C /tmp/forward-data-watchdog log -1 --format=%cI -- "$canonical_snapshot_path")
          test -n "$snapshot_persisted_at"
          echo "Decision recovery anchored to latest canonical snapshot: $target persisted_at=$snapshot_persisted_at"

          wait_for_decision() {
            local workflow="$1"
            local decision_path="$2"
            local label="$3"

            git fetch --quiet origin forward-data/v2
            git -C /tmp/forward-data-watchdog reset --hard --quiet origin/forward-data/v2
            if [[ -f "$decision_path" ]]; then
              echo "$label decision already exists for $target."
              return 0
            fi

            local run_id
            run_id=$(gh run list --workflow "$workflow" --limit 20 \
              --json databaseId,status,createdAt \
              --jq "[.[] | select((.status == \"queued\" or .status == \"in_progress\") and .createdAt >= \"$snapshot_persisted_at\")] | sort_by(.createdAt) | last | .databaseId // empty")

            if [[ -z "$run_id" ]]; then
              local dispatched_at
              dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              echo "Missing $label decision for $target; dispatching frozen workflow $workflow."
              gh workflow run "$workflow" --ref main

              for attempt in $(seq 1 20); do
                sleep 3
                run_id=$(gh run list --workflow "$workflow" --event workflow_dispatch --limit 20 \
                  --json databaseId,status,createdAt \
                  --jq "[.[] | select(.createdAt >= \"$dispatched_at\")] | sort_by(.createdAt) | last | .databaseId // empty")
                if [[ -n "$run_id" ]]; then
                  break
                fi
              done
              if [[ -z "$run_id" ]]; then
                echo "Unable to bind the dispatched $label workflow to a concrete run ID; failing closed." >&2
                return 1
              fi
            else
              echo "A target-capable $label workflow is already active as run $run_id; waiting for its append-only result."
            fi

            for attempt in $(seq 1 60); do
              sleep 15
              git fetch --quiet origin forward-data/v2
              git -C /tmp/forward-data-watchdog reset --hard --quiet origin/forward-data/v2
              if [[ -f "$decision_path" ]]; then
                echo "$label decision persisted for $target by bound run $run_id."
                return 0
              fi

              local run_state
              run_state=$(gh run view "$run_id" --json status,conclusion \
                --jq '[.status, (.conclusion // "")] | @tsv')
              local run_status="${run_state%%$'\t'*}"
              local run_conclusion="${run_state#*$'\t'}"
              if [[ "$run_status" == "completed" ]]; then
                if [[ "$run_conclusion" != "success" ]]; then
                  echo "$label bound run $run_id completed with $run_conclusion before persistence; failing closed." >&2
                  return 1
                fi
                echo "$label bound run $run_id completed successfully but its decision is not yet visible; continuing bounded persistence wait."
              fi
            done

            echo "Timed out waiting for $label decision persistence from bound run $run_id; failing closed." >&2
            return 1
          }

          wait_for_decision \
            market-state-router-v21.yml \
            "/tmp/forward-data-watchdog/data/market-state-router/decisions/$safe.json" \
            "v2.1"
          wait_for_decision \
            forward-alpha-decisions-v23.yml \
            "/tmp/forward-data-watchdog/data/forward-alpha-v23/decisions/$safe.json" \
            "v2.3"
          wait_for_decision \
            forward-alpha-decisions-v25.yml \
            "/tmp/forward-data-watchdog/data/forward-alpha-v25/decisions/$safe.json" \
            "v2.5"

          echo "Watchdog completed without modifying strategy or evidence bytes."
