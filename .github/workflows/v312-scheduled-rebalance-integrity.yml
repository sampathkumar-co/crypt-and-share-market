name: v3.1.2 Scheduled-Rebalance Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/V312_SCHEDULED_REBALANCE_INTEGRITY_ADDENDUM.md"
      - "src/tradebot/research/historical_yield_trend_scheduled_execution_v312.py"
      - "src/tradebot/research/historical_yield_trend_integrity_v312.py"
      - "tests/test_historical_yield_trend_scheduled_execution_v312.py"
      - ".github/workflows/v312-scheduled-rebalance-integrity.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "research/V312_SCHEDULED_REBALANCE_INTEGRITY_ADDENDUM.md"
      - "src/tradebot/research/historical_yield_trend_scheduled_execution_v312.py"
      - "src/tradebot/research/historical_yield_trend_integrity_v312.py"
      - "tests/test_historical_yield_trend_scheduled_execution_v312.py"
      - ".github/workflows/v312-scheduled-rebalance-integrity.yml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: v312-scheduled-rebalance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-v312:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile v3.1.2
        run: |
          python -m py_compile src/tradebot/research/historical_yield_trend_scheduled_execution_v312.py
          python -m py_compile src/tradebot/research/historical_yield_trend_integrity_v312.py
      - name: Verify frozen v3.1 and Track A are unchanged
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" -- \
            src/tradebot/research/forward_alpha_v25.py \
            src/tradebot/research/forward_alpha_v25_readiness.py \
            research/V25_HIGH_CONVICTION_ALPHA_PROTOCOL.md \
            src/tradebot/research/historical_yield_trend_v31.py \
            src/tradebot/research/historical_yield_trend_v31_runner.py \
            src/tradebot/research/historical_yield_trend_v311_transport.py \
            research/V31_YIELD_TREND_OVERLAY_PROTOCOL.md \
            research/V31_SOURCE_AVAILABILITY_ADDENDUM.md \
            research/V311_FEDERAL_RESERVE_H15_TRANSPORT_ADDENDUM.md \
            src/tradebot/backtest/profit_quality_gate.py \
            src/tradebot/backtest/selection_stability.py
      - name: Run focused execution-integrity tests
        run: python -m pytest tests/test_historical_yield_trend_scheduled_execution_v312.py -q
      - name: Run complete repository suite
        run: python -m pytest -q
      - name: Enforce paper-only exact-model boundary
        shell: bash
        run: |
          grep -q 'MODE = "HISTORICAL_YIELD_TREND_SCHEDULED_EXECUTION_AUDIT_ONLY"' \
            src/tradebot/research/historical_yield_trend_integrity_v312.py
          grep -q 'EXPECTED_MODEL_ID = "sma100-rebalance10-top1-exposure10-vol2-brake20"' \
            src/tradebot/research/historical_yield_trend_integrity_v312.py
          grep -q 'non-due trend day generated turnover' \
            src/tradebot/research/historical_yield_trend_scheduled_execution_v312.py
          ! grep -q 'forward-data/v2' \
            src/tradebot/research/historical_yield_trend_integrity_v312.py \
            src/tradebot/research/historical_yield_trend_scheduled_execution_v312.py
          ! grep -Eiq '(private_key|api_secret|withdraw|place_order|create_order)' \
            src/tradebot/research/historical_yield_trend_integrity_v312.py \
            src/tradebot/research/historical_yield_trend_scheduled_execution_v312.py

  run-fixed-v312:
    if: github.event_name != 'pull_request'
    needs: verify-v312
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run corrected Binance audit
        run: |
          mkdir -p evidence/v312-scheduled-rebalance
          tradebot-v312-scheduled-integrity \
            --json-out evidence/v312-scheduled-rebalance/report.json \
            --max-workers 20
      - name: Validate deterministic integrity report
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report = json.loads(Path(
              "evidence/v312-scheduled-rebalance/report.json"
          ).read_text(encoding="utf-8"))
          assert report["schema_version"] == "3.1.2-scheduled-rebalance-integrity"
          assert report["mode"] == "HISTORICAL_YIELD_TREND_SCHEDULED_EXECUTION_AUDIT_ONLY"
          assert report["paper_only"] is True
          assert report["authorizes_trading"] is False
          assert report["authorizes_shadow_paper"] is False
          assert report["changes_track_a"] is False
          assert report["cannot_replace_forward_evidence"] is True
          assert report["frozen_model"]["model_id"] == (
              "sma100-rebalance10-top1-exposure10-vol2-brake20"
          )
          assert report["execution_policy"] == (
              "daily_risk_exit_entry_or_due_rebalance_only_natural_drift"
          )
          assert [item["name"] for item in report["verification_periods"]] == [
              "2021", "2022", "2023", "2024", "2025"
          ]
          assert report["source_inventory"]
          assert report["source_inventory_sha256"]
          assert report["fingerprints"]["integrity_addendum_sha256"]
          assert report["fingerprints"]["scheduled_execution_sha256"]
          canonical = dict(report)
          expected = canonical.pop("report_sha256")
          encoded = json.dumps(
              canonical,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == expected
          print(json.dumps({
              "status": report["screening_status"],
              "standard_return": report["standard"]["net_compounded_return"],
              "stress_return": report["stress"]["net_compounded_return"],
              "cash_return": report["standard"]["cash_benchmark_compounded_return"],
              "standard_years": report["standard"]["window_returns"],
              "stress_years": report["stress"]["window_returns"],
              "standard_excess_years": report["standard"]["excess_window_returns"],
              "stress_excess_years": report["stress"]["excess_window_returns"],
              "action_days": report["standard"]["window_action_days"],
              "turnover": report["standard"]["crypto_turnover"],
              "gates": report["gates"],
              "maximum_drawdown": report["standard"]["maximum_drawdown"],
              "report_sha256": expected,
          }, indent=2, sort_keys=True))
          PY
      - name: Persist immutable v3.1.2 result
        shell: bash
        run: |
          git fetch origin historical-results/v312
          git worktree add result-branch origin/historical-results/v312
          mkdir -p result-branch/results
          cp evidence/v312-scheduled-rebalance/report.json result-branch/results/latest.json
          cp evidence/v312-scheduled-rebalance/report.json \
            "result-branch/results/run-${GITHUB_RUN_ID}.json"
          cd result-branch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/latest.json "results/run-${GITHUB_RUN_ID}.json"
          git commit -m "Append v3.1.2 integrity result ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin historical-results/v312
            git rebase origin/historical-results/v312
            if git push origin HEAD:historical-results/v312; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload v3.1.2 report
        uses: actions/upload-artifact@v4
        with:
          name: v312-scheduled-rebalance-${{ github.run_id }}
          path: evidence/v312-scheduled-rebalance/report.json
          retention-days: 90
          if-no-files-found: error
