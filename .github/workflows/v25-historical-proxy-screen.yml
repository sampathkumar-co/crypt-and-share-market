name: Track B v2.5 Historical Proxy Screen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/V25_HISTORICAL_PROXY_SCREEN_PROTOCOL.md"
      - "src/tradebot/research/historical_proxy_screen_v25.py"
      - "tests/test_historical_proxy_screen_v25.py"
      - "tests/test_historical_proxy_result_persistence.py"
      - ".github/workflows/v25-historical-proxy-screen.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/triggers/v25-historical-proxy-screen-once.txt"
      - "research/V25_HISTORICAL_PROXY_SCREEN_PROTOCOL.md"
      - "src/tradebot/research/historical_proxy_screen_v25.py"
      - "tests/test_historical_proxy_screen_v25.py"
      - "tests/test_historical_proxy_result_persistence.py"
      - ".github/workflows/v25-historical-proxy-screen.yml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: v25-historical-proxy-screen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-track-b:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Track B
        run: python -m py_compile src/tradebot/research/historical_proxy_screen_v25.py
      - name: Verify Track A and frozen gates are unchanged
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" -- \
            src/tradebot/research/forward_alpha_v25.py \
            src/tradebot/research/forward_alpha_v25_readiness.py \
            research/V25_HIGH_CONVICTION_ALPHA_PROTOCOL.md \
            research/V24_FORWARD_ALPHA_EVALUATION_PROTOCOL.md \
            src/tradebot/backtest/profit_quality_gate.py \
            src/tradebot/backtest/selection_stability.py
      - name: Run focused tests
        run: |
          python -m pytest tests/test_historical_proxy_screen_v25.py -q
          python -m pytest tests/test_historical_proxy_result_persistence.py -q
      - name: Run complete repository suite
        run: python -m pytest -q
      - name: Enforce isolated paper-only boundary
        shell: bash
        run: |
          grep -q 'MODE = "HISTORICAL_PROXY_SCREEN_ONLY"' src/tradebot/research/historical_proxy_screen_v25.py
          grep -q '"authorizes_trading": False' src/tradebot/research/historical_proxy_screen_v25.py
          grep -q '"authorizes_shadow_paper": False' src/tradebot/research/historical_proxy_screen_v25.py
          grep -q '"changes_track_a": False' src/tradebot/research/historical_proxy_screen_v25.py
          ! grep -Eiq '(private_key|api_secret|withdraw|place_order|create_order)' \
            src/tradebot/research/historical_proxy_screen_v25.py

  run-fixed-historical-screen:
    if: github.event_name != 'pull_request'
    needs: verify-track-b
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run frozen historical proxy screen
        run: |
          mkdir -p evidence/v25-historical-proxy
          tradebot-v25-historical-proxy-screen \
            --json-out evidence/v25-historical-proxy/report.json \
            --max-workers 8
      - name: Validate deterministic isolated report
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("evidence/v25-historical-proxy/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["schema_version"] == "2.5-historical-proxy-screen"
          assert report["mode"] == "HISTORICAL_PROXY_SCREEN_ONLY"
          assert report["paper_only"] is True
          assert report["authorizes_trading"] is False
          assert report["authorizes_shadow_paper"] is False
          assert report["changes_track_a"] is False
          assert report["cannot_replace_forward_evidence"] is True
          assert report["screen_start_utc"] == "2026-06-01T00:00:00Z"
          assert report["screen_end_utc"] == "2026-06-30T23:00:00Z"
          assert report["source_inventory"]
          canonical = dict(report)
          expected = canonical.pop("report_sha256")
          encoded = json.dumps(canonical, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == expected
          primary = report["results"]["4"]["standard"]
          print(json.dumps({
              "status": report["screening_status"],
              "events": report["event_count"],
              "active_assets": report["active_assets"],
              "active_families": report["active_families"],
              "four_hour_net_return": primary["net_compounded_return"],
              "four_hour_stress_return": report["results"]["4"]["stress"]["net_compounded_return"],
              "maximum_drawdown": primary["maximum_drawdown"],
              "report_sha256": expected,
          }, indent=2, sort_keys=True))
          PY
      - name: Persist auditable report on isolated results branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin historical-results/v25
          rm -rf /tmp/v25-historical-results
          git worktree add --detach /tmp/v25-historical-results origin/historical-results/v25
          mkdir -p /tmp/v25-historical-results/results
          cp evidence/v25-historical-proxy/report.json \
            /tmp/v25-historical-results/results/latest.json
          cp evidence/v25-historical-proxy/report.json \
            "/tmp/v25-historical-results/results/run-${GITHUB_RUN_ID}.json"
          git -C /tmp/v25-historical-results config user.name github-actions[bot]
          git -C /tmp/v25-historical-results config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/v25-historical-results add results/latest.json "results/run-${GITHUB_RUN_ID}.json"
          if git -C /tmp/v25-historical-results diff --cached --quiet; then
            echo "Identical Track B report already persisted."
            exit 0
          fi
          git -C /tmp/v25-historical-results commit \
            -m "Persist v2.5 historical proxy report ${GITHUB_RUN_ID}"
          git -C /tmp/v25-historical-results push origin HEAD:historical-results/v25
      - name: Upload Track B report
        uses: actions/upload-artifact@v4
        with:
          name: v25-historical-proxy-screen-${{ github.run_id }}
          path: evidence/v25-historical-proxy/report.json
          retention-days: 90
          if-no-files-found: error
