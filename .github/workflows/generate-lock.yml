name: Generate Lockfile

on:
  push:
    branches: [hardening/datafactor-remediation]
    paths:
      - pyproject.toml
      - .github/workflows/generate-lock.yml
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/generate-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate hashed lockfile
        run: |
          python -m pip install --upgrade pip pip-tools
          python -m piptools compile --extra dev --generate-hashes --output-file requirements.lock pyproject.toml
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements.lock
          if-no-files-found: error
