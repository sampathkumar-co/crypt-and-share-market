name: Forward Alpha Candidates v2.3

on:
  pull_request:
    paths:
      - "research/V23_FORWARD_ALPHA_CANDIDATES_PROTOCOL.md"
      - "src/tradebot/research/forward_alpha_candidates.py"
      - "tests/test_forward_alpha_candidates.py"
      - "pyproject.toml"
      - ".github/workflows/forward-alpha-v23.yml"
      - ".github/workflows/forward-alpha-decisions-v23.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-forward-alpha:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Compile v2.3 router
        run: python -m py_compile src/tradebot/research/forward_alpha_candidates.py

      - name: Verify protocol and frozen parent files
        shell: bash
        run: |
          test -f research/V23_FORWARD_ALPHA_CANDIDATES_PROTOCOL.md
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --exit-code "${{ github.event.pull_request.base.sha }}" -- \
              src/tradebot/research/market_state_router.py \
              research/V21_MARKET_STATE_ROUTER_PROTOCOL.md
          fi

      - name: Run focused forward alpha tests
        run: python -m pytest tests/test_forward_alpha_candidates.py -q

      - name: Run complete repository suite
        run: python -m pytest -q

      - name: Enforce paper-only source boundary
        shell: bash
        run: |
          ! grep -Eiq "(place_order|private_key|api_secret|withdraw|leverage[[:space:]]*=|short_position)" \
            src/tradebot/research/forward_alpha_candidates.py
          grep -q '"authorizes_trading": False' src/tradebot/research/forward_alpha_candidates.py
