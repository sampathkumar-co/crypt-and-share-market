name: Container

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "pyproject.toml"
      - "src/**"
      - "data/**"
      - "research/**"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: tradebot:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot and verify container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name tradebot-smoke --publish 127.0.0.1:18000:8000 tradebot:ci
          trap 'docker logs tradebot-smoke || true; docker rm --force tradebot-smoke || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/ready > /tmp/ready.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18000/health | tee /tmp/health.json
          curl --fail --silent --show-error http://127.0.0.1:18000/research/status | tee /tmp/research.json
          grep -q '"status": "ready"' /tmp/ready.json
          grep -q '"mutations_enabled": false' /tmp/health.json
          grep -q '"deployment_mode": "research_only"' /tmp/health.json
          grep -q '"approved_strategy_count": 0' /tmp/health.json
          grep -q '"source_valid": true' /tmp/research.json
          grep -q '"approved_strategy_count": 0' /tmp/research.json
          grep -q '"continuous_paper_authorized": false' /tmp/research.json
          grep -q '"live_trading_authorized": false' /tmp/research.json

          status=$(curl --silent --output /tmp/post.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:18000/run/scan)
          test "$status" = "403"
          grep -q 'Mutation endpoints are disabled' /tmp/post.json

          test "$(docker inspect --format '{{.Config.User}}' tradebot-smoke)" = "tradebot:tradebot"

  publish:
    if: github.event_name != 'pull_request'
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.image.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
