name: v2.8 Regime-Adaptive Rotation

on:
  pull_request:
    paths:
      - "research/V28_REGIME_ADAPTIVE_ROTATION_PROTOCOL.md"
      - "src/tradebot/research/historical_rotation_v28.py"
      - "tests/test_historical_rotation_v28.py"
      - "pyproject.toml"
      - ".github/workflows/v28-regime-adaptive-rotation.yml"
  push:
    branches: [main]
    paths:
      - "research/V28_REGIME_ADAPTIVE_ROTATION_PROTOCOL.md"
      - "src/tradebot/research/historical_rotation_v28.py"
      - "tests/test_historical_rotation_v28.py"
      - "pyproject.toml"
      - ".github/workflows/v28-regime-adaptive-rotation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v28-regime-adaptive-rotation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: ${{ github.event_name == 'pull_request' && 'read' || 'write' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and verify isolation
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m py_compile src/tradebot/research/historical_rotation_v28.py
          python -m pytest tests/test_historical_rotation_v28.py -q
          git diff --exit-code origin/main -- \
            src/tradebot/backtest/profit_quality_gate.py \
            src/tradebot/backtest/selection_stability.py \
            src/tradebot/research/historical_discovery_v27.py \
            src/tradebot/research/historical_discovery_v27_runner.py
          test "$(git hash-object research/V28_REGIME_ADAPTIVE_ROTATION_PROTOCOL.md)" = \
            "$(git rev-parse HEAD:research/V28_REGIME_ADAPTIVE_ROTATION_PROTOCOL.md)"
      - name: Run full repository tests
        run: python -m pytest -q
      - name: Run frozen v2.8 experiment
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p evidence/v28
          tradebot-v28-historical-rotation --json-out evidence/v28/report.json --max-workers 20
      - name: Validate report integrity
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('evidence/v28/report.json')
          report = json.loads(path.read_text())
          assert report['schema_version'] == '2.8-regime-adaptive-rotation'
          assert report['paper_only'] is True
          assert report['authorizes_trading'] is False
          assert report['authorizes_shadow_paper'] is False
          assert report['changes_track_a'] is False
          assert report['cannot_replace_forward_evidence'] is True
          assert len(report['selection_table']) == 32
          assert list(report['verification']['standard']['window_returns']) == [
              '2023-Q4', '2024-Q1', '2024-Q2', '2024-Q3', '2024-Q4'
          ]
          canonical = dict(report)
          expected = canonical.pop('report_sha256')
          encoded = json.dumps(canonical, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
          assert hashlib.sha256(encoded).hexdigest() == expected
          print(json.dumps({
              'status': report['screening_status'],
              'chosen_model': report['chosen_model'],
              'standard': report['verification']['standard']['window_returns'],
              'stress': report['verification']['stress']['window_returns'],
              'sha256': expected,
          }, indent=2, sort_keys=True))
          PY
      - name: Persist immutable report
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git fetch origin historical-results/v28
          git worktree add result-branch origin/historical-results/v28
          mkdir -p result-branch/results
          cp evidence/v28/report.json result-branch/results/latest.json
          cp evidence/v28/report.json "result-branch/results/run-${GITHUB_RUN_ID}.json"
          cd result-branch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results
          git commit -m "Append v2.8 result ${GITHUB_RUN_ID}"
          git push origin HEAD:historical-results/v28
      - name: Upload evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: v28-regime-adaptive-rotation-${{ github.run_id }}
          path: evidence/v28/report.json
          retention-days: 90
          if-no-files-found: error
