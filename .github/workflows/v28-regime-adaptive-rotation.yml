name: v2.8 Regime-Adaptive Rotation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/V28_REGIME_ADAPTIVE_ROTATION_PROTOCOL.md"
      - "src/tradebot/research/historical_rotation_v28.py"
      - "src/tradebot/research/historical_rotation_v28_runner.py"
      - "tests/test_historical_rotation_v28.py"
      - "tests/test_historical_rotation_v28_runner.py"
      - ".github/workflows/v28-regime-adaptive-rotation.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "research/V28_REGIME_ADAPTIVE_ROTATION_PROTOCOL.md"
      - "src/tradebot/research/historical_rotation_v28.py"
      - "src/tradebot/research/historical_rotation_v28_runner.py"
      - "tests/test_historical_rotation_v28.py"
      - "tests/test_historical_rotation_v28_runner.py"
      - ".github/workflows/v28-regime-adaptive-rotation.yml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: v28-regime-adaptive-rotation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-v28:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile v2.8
        run: |
          python -m py_compile src/tradebot/research/historical_rotation_v28.py
          python -m py_compile src/tradebot/research/historical_rotation_v28_runner.py
      - name: Verify frozen campaigns and gates are unchanged
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" -- \
            src/tradebot/research/forward_alpha_v25.py \
            src/tradebot/research/forward_alpha_v25_readiness.py \
            research/V25_HIGH_CONVICTION_ALPHA_PROTOCOL.md \
            src/tradebot/research/historical_proxy_screen_v25.py \
            research/V25_HISTORICAL_PROXY_SCREEN_PROTOCOL.md \
            src/tradebot/research/historical_discovery_v26.py \
            research/V26_COST_AWARE_HISTORICAL_DISCOVERY_PROTOCOL.md \
            src/tradebot/research/historical_discovery_v27.py \
            src/tradebot/research/historical_discovery_v27_runner.py \
            research/V27_FIVEFOLD_MECHANISM_DISCOVERY_PROTOCOL.md \
            src/tradebot/backtest/profit_quality_gate.py \
            src/tradebot/backtest/selection_stability.py
      - name: Run focused v2.8 tests
        run: |
          python -m pytest \
            tests/test_historical_rotation_v28.py \
            tests/test_historical_rotation_v28_runner.py -q
      - name: Run complete repository suite
        run: python -m pytest -q
      - name: Enforce isolated paper-only boundary
        shell: bash
        run: |
          grep -q 'MODE = "HISTORICAL_REGIME_ADAPTIVE_ROTATION_ONLY"' \
            src/tradebot/research/historical_rotation_v28.py
          grep -q 'MAX_EXPOSURE = 0.30' \
            src/tradebot/research/historical_rotation_v28.py
          grep -q 'independent_windows_start_and_end_in_cash' \
            src/tradebot/research/historical_rotation_v28_runner.py
          ! grep -q 'forward-data/v2' \
            src/tradebot/research/historical_rotation_v28.py
          ! grep -Eiq '(private_key|api_secret|withdraw|place_order|create_order)' \
            src/tradebot/research/historical_rotation_v28.py \
            src/tradebot/research/historical_rotation_v28_runner.py

  run-fixed-v28:
    if: github.event_name != 'pull_request'
    needs: verify-v28
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run frozen v2.8 screen
        run: |
          mkdir -p evidence/v28-regime-adaptive-rotation
          tradebot-v28-historical-rotation \
            --json-out evidence/v28-regime-adaptive-rotation/report.json \
            --max-workers 20
      - name: Validate deterministic five-quarter report
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("evidence/v28-regime-adaptive-rotation/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["schema_version"] == "2.8-regime-adaptive-rotation"
          assert report["mode"] == "HISTORICAL_REGIME_ADAPTIVE_ROTATION_ONLY"
          assert report["paper_only"] is True
          assert report["authorizes_trading"] is False
          assert report["authorizes_shadow_paper"] is False
          assert report["changes_track_a"] is False
          assert report["cannot_replace_forward_evidence"] is True
          assert report["model_grid_size"] == 32
          assert report["accounting_policy"] == (
              "independent_windows_start_and_end_in_cash"
          )
          assert report["fingerprints"]["runner_sha256"]
          assert [item["name"] for item in report["verification_windows"]] == [
              "2023-Q4", "2024-Q1", "2024-Q2", "2024-Q3", "2024-Q4"
          ]
          assert report["source_inventory"]
          canonical = dict(report)
          expected = canonical.pop("report_sha256")
          encoded = json.dumps(
              canonical,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == expected
          verification = report["verification"]
          print(json.dumps({
              "status": report["screening_status"],
              "chosen_model": report["chosen_model"],
              "standard_return": verification["standard"]["net_compounded_return"],
              "stress_return": verification["stress"]["net_compounded_return"],
              "standard_quarters": verification["standard"]["window_returns"],
              "stress_quarters": verification["stress"]["window_returns"],
              "action_days": verification["standard"]["window_action_days"],
              "maximum_drawdown": verification["standard"]["maximum_drawdown"],
              "report_sha256": expected,
          }, indent=2, sort_keys=True))
          PY
      - name: Persist immutable v2.8 result
        shell: bash
        run: |
          git fetch origin historical-results/v28
          git worktree add result-branch origin/historical-results/v28
          mkdir -p result-branch/results
          cp evidence/v28-regime-adaptive-rotation/report.json \
            result-branch/results/latest.json
          cp evidence/v28-regime-adaptive-rotation/report.json \
            "result-branch/results/run-${GITHUB_RUN_ID}.json"
          cd result-branch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/latest.json "results/run-${GITHUB_RUN_ID}.json"
          git commit -m "Append v2.8 rotation result ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin historical-results/v28
            git rebase origin/historical-results/v28
            if git push origin HEAD:historical-results/v28; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload v2.8 report
        uses: actions/upload-artifact@v4
        with:
          name: v28-regime-adaptive-rotation-${{ github.run_id }}
          path: evidence/v28-regime-adaptive-rotation/report.json
          retention-days: 90
          if-no-files-found: error
