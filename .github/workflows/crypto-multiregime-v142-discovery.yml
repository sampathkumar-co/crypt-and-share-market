name: Crypto Multi-Regime v1.4.2 Discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/crypto-multiregime-v142-discovery.yml"
      - "research/v142_data_freeze_record.json"
      - "research/V142_DATA_FREEZE.md"
      - "src/tradebot/backtest/crypto_multiregime_4h.py"
      - "src/tradebot/backtest/crypto_multiregime_4h_calendar_funding.py"
      - "src/tradebot/data/crypto_4h_provider.py"
      - "src/tradebot/data/crypto_4h_provider_bounded_continuity.py"
      - "src/tradebot/data/crypto_v14_external_factors.py"
      - "tests/test_crypto_multiregime_4h.py"
      - "tests/test_crypto_multiregime_4h_calendar_funding.py"
      - "tests/test_crypto_4h_provider.py"
      - "tests/test_crypto_4h_provider_bounded_continuity.py"
      - "tests/test_crypto_v14_external_factors.py"
      - "pyproject.toml"

concurrency:
  group: crypto-multiregime-v142-discovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen engine and freeze record
        shell: bash
        run: |
          git diff --exit-code d1fe29287eed65257082c361bcb0b8872590500d -- \
            src/tradebot/backtest/crypto_multiregime_4h.py \
            src/tradebot/backtest/crypto_multiregime_4h_calendar_funding.py \
            src/tradebot/data/crypto_4h_provider.py \
            src/tradebot/data/crypto_4h_provider_bounded_continuity.py \
            src/tradebot/data/crypto_v14_external_factors.py \
            tests/test_crypto_multiregime_4h.py \
            tests/test_crypto_multiregime_4h_calendar_funding.py \
            tests/test_crypto_4h_provider.py \
            tests/test_crypto_4h_provider_bounded_continuity.py \
            tests/test_crypto_v14_external_factors.py \
            pyproject.toml
          git show da5935ae696a150ddf3b48a8d1186142054451bd:research/v142_data_freeze_record.json > /tmp/frozen-record.json
          cmp /tmp/frozen-record.json research/v142_data_freeze_record.json
          git show da5935ae696a150ddf3b48a8d1186142054451bd:research/V142_DATA_FREEZE.md > /tmp/frozen-record.md
          cmp /tmp/frozen-record.md research/V142_DATA_FREEZE.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test complete repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q
          mkdir -p frozen-v142 reports/v142-discovery

      - name: Download immutable v1.4.2 data freeze
        uses: actions/download-artifact@v4
        with:
          name: crypto-multiregime-v142-data-freeze
          path: frozen-v142
          repository: sampathkumar-co/crypt-and-share-market
          run-id: 30516539776
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded freeze byte-for-byte
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from tradebot.backtest.research_gate import dataset_fingerprint, load_histories
          from tradebot.data.crypto_4h_provider_bounded_continuity import verify_v142_manifest
          from tradebot.data.crypto_external_factors import verify_external_manifest

          record = json.loads(Path("research/v142_data_freeze_record.json").read_text(encoding="utf-8"))

          def sha256(path):
              digest = hashlib.sha256()
              with Path(path).open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          price_manifest = Path("frozen-v142/data/v142-market/manifest.json")
          external_manifest = Path("frozen-v142/data/v142-external/manifest.json")
          assert sha256(price_manifest) == record["price_manifest_sha256"]
          assert sha256(external_manifest) == record["external_manifest_sha256"]
          price = verify_v142_manifest("frozen-v142/data/v142-market")
          external = verify_external_manifest("frozen-v142/data/v142-external")
          assert price["dataset_fingerprint"] == record["price_dataset_fingerprint"]
          assert price["requested_start"] == record["market_start"]
          assert price["requested_end_exclusive"] == record["market_end_exclusive"]
          assert sum(item["synthetic_hourly_rows"] for item in price["sources"]) == record["synthetic_hourly_rows"] == 43
          assert external["requested_start"] == record["external_start"]
          assert external["requested_end"] == record["external_end"]
          histories = load_histories("frozen-v142/data/v142-market/four_hour")
          assert dataset_fingerprint(histories) == record["price_dataset_fingerprint"]
          assert set(histories) == set(record["symbols"])
          assert all(len(candles) == record["four_hour_rows_per_asset"] for candles in histories.values())
          assert record["strategy_returns_calculated"] is False
          assert record["holdout_returns_calculated"] is False
          print("verified price fingerprint:", record["price_dataset_fingerprint"])
          print("verified price manifest:", record["price_manifest_sha256"])
          print("verified external manifest:", record["external_manifest_sha256"])
          PY

      - name: Run frozen discovery only
        shell: bash
        run: |
          set +e
          tradebot-crypto-multiregime-4h \
            --price-folder frozen-v142/data/v142-market/four_hour \
            --external-folder frozen-v142/data/v142-external \
            --json-out reports/v142-discovery/discovery.json \
            --mode discovery \
            > reports/v142-discovery/discovery_stdout.json
          status=$?
          set -e
          echo "$status" > reports/v142-discovery/exit_status.txt
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "Unexpected discovery software failure: $status" >&2
            exit "$status"
          fi
          echo "Discovery completed with research status $status"

      - name: Validate discovery evidence and holdout isolation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("reports/v142-discovery/discovery.json").read_text(encoding="utf-8"))
          record = json.loads(Path("research/v142_data_freeze_record.json").read_text(encoding="utf-8"))
          status = int(Path("reports/v142-discovery/exit_status.txt").read_text(encoding="utf-8").strip())

          assert payload["schema_version"] == "1.4.2"
          assert payload["mode"] == "discovery"
          assert payload["market"] == "crypto"
          assert payload["paper_only"] is True
          assert payload["authorizes_real_trading"] is False
          assert payload["eligible_for_shadow_paper"] is False
          assert payload["eligible_for_forward_paper"] is False
          assert payload["price_dataset_fingerprint"] == record["price_dataset_fingerprint"]
          assert payload["external_manifest_fingerprint"] == record["external_manifest_sha256"]
          assert payload["dataset_start"] == "2023-11-15T00:00:00"
          assert payload["dataset_end"] == "2025-11-22T20:00:00"
          assert payload["discovery_test_start"] == "2024-02-23T00:00:00"
          assert payload["discovery_test_end"] == "2025-06-16T20:00:00"
          assert payload["embargo_start"] == "2025-06-17T00:00:00"
          assert payload["embargo_end"] == "2025-07-25T20:00:00"
          assert payload["holdout_start"] == "2025-07-26T00:00:00"
          assert payload["holdout_end"] == "2025-11-22T20:00:00"
          assert set(payload["symbols"]) == set(record["symbols"])
          assert len(payload["variants"]) == 9
          by_name = {item["variant"]: item for item in payload["variants"]}
          expected = {
              "primary_multiregime", "without_trend", "without_range",
              "without_funding", "trend_only", "range_only", "funding_only",
              "cash", "equal_weight_buy_hold",
          }
          assert set(by_name) == expected
          assert all(len(item["periods"]) == 6 for item in payload["variants"])
          assert all(
              period["mode"] == "discovery"
              and period["test_end"] <= payload["discovery_test_end"]
              and period["test_start"] < payload["embargo_start"]
              for item in payload["variants"]
              for period in item["periods"]
          )
          assert len(payload["leave_one_asset_out_average_returns"]) == 8
          assert set(payload["leave_one_asset_out_average_returns"]) == set(record["symbols"])
          assert payload["accepted"] is (status == 0)
          assert payload["eligible_for_holdout"] is payload["accepted"]
          assert (not payload["accepted"]) or not payload["reasons"]
          assert payload["accepted"] or payload["reasons"]

          lines = [
              "# Crypto Multi-Regime v1.4.2 Discovery",
              "",
              f"- Accepted for one-shot holdout: **{payload['accepted']}**",
              f"- Price fingerprint: `{payload['price_dataset_fingerprint']}`",
              f"- External manifest: `{payload['external_manifest_fingerprint']}`",
              f"- Discovery interval: `{payload['discovery_test_start']}` to `{payload['discovery_test_end']}`",
              f"- Locked holdout: `{payload['holdout_start']}` to `{payload['holdout_end']}`",
              "- Holdout returns evaluated: **False**",
              "",
              "| Variant | Active | Positive | Average | Median | Compounded | Stressed | Worst DD | Max asset share | Assets |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for item in payload["variants"]:
              lines.append(
                  f"| {item['variant']} | {item['active_periods']}/6 | {item['positive_periods']}/6 | "
                  f"{item['average_return']:.3%} | {item['median_return']:.3%} | "
                  f"{item['compounded_return']:.3%} | {item['average_stressed_return']:.3%} | "
                  f"{item['worst_drawdown']:.3%} | {item['max_asset_notional_fraction']:.2%} | "
                  f"{len(item['selected_symbols'])} |"
              )
          primary = by_name["primary_multiregime"]
          lines.extend([
              "",
              f"- Primary beats trend-only periods: **{payload['primary_beats_trend_periods']}/6**",
              f"- Positive leave-one-sleeve-out variants: **{payload['positive_sleeve_ablations']}/3**",
              f"- Positive leave-one-asset-out reruns: **{payload['leave_one_asset_out_positive_count']}/8**",
              f"- Primary sleeve entries: `{json.dumps(primary['sleeve_entries'], sort_keys=True)}`",
              f"- Primary selected assets: `{', '.join(primary['selected_symbols']) or 'none'}`",
              "",
              "Reasons: " + (", ".join(payload["reasons"]) if payload["reasons"] else "none"),
              "",
              "This discovery workflow did not evaluate the final 720-bar holdout and cannot authorise real-money trading.",
          ])
          report = "\n".join(lines) + "\n"
          Path("reports/v142-discovery/discovery.md").write_text(report, encoding="utf-8")
          print(report)
          PY
          cat reports/v142-discovery/discovery.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-multiregime-v142-discovery
          path: |
            reports/v142-discovery
            research/v142_data_freeze_record.json
            research/V142_DATA_FREEZE.md
            frozen-v142/reports/v142/data_freeze_summary.json
            frozen-v142/data/v142-market/manifest.json
            frozen-v142/data/v142-external/manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
