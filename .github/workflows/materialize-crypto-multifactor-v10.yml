name: Materialize Crypto Multifactor v1.0

on:
  push:
    paths:
      - ".github/workflows/materialize-crypto-multifactor-v10.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract staged payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          root = Path("research_payload/v10")
          encoded = "".join(path.read_text(encoding="utf-8").strip() for path in sorted(root.glob("part*.b64")))
          archive = base64.b64decode(encoded)
          digest = hashlib.sha256(archive).hexdigest()
          expected = "5c032417c19e55fd0db7d4b9e34d55e402566a40fbf4b26725fe25fd8830593f"
          if digest != expected:
              raise SystemExit(f"Payload digest mismatch: {digest}")
          allowed = {
              "src/tradebot/backtest/crypto_multifactor.py",
              "tests/test_crypto_multifactor.py",
              "pyproject.toml",
              ".github/workflows/crypto-multifactor-v10.yml",
          }
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
              members = [member for member in bundle.getmembers() if member.isfile()]
              names = {member.name for member in members}
              if names != allowed:
                  raise SystemExit(f"Unexpected payload paths: {sorted(names ^ allowed)}")
              for member in members:
                  if member.name.startswith("/") or ".." in Path(member.name).parts:
                      raise SystemExit(f"Unsafe payload path: {member.name}")
              bundle.extractall(".", members=members, filter="data")
          print(f"Verified payload {digest} with {len(allowed)} files")
          PY

      - name: Test materialized source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests
          python -m pytest -q

      - name: Commit tested source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tradebot/backtest/crypto_multifactor.py tests/test_crypto_multifactor.py pyproject.toml
          git commit -m "Implement frozen v1.0 crypto multifactor portfolio"
          git push origin "HEAD:${GITHUB_REF_NAME}"
