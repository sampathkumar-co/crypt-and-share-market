name: v4.7 Residual Momentum Breakout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/V47_RESIDUAL_MOMENTUM_BREAKOUT_PROTOCOL.md"
      - "research/V471_RESIDUAL_MOMENTUM_BREAKOUT_IMPLEMENTATION_CONTRACT.md"
      - "src/tradebot/research/residual_momentum_breakout_v47.py"
      - "src/tradebot/research/residual_momentum_breakout_v47_exact.py"
      - "tests/test_residual_momentum_breakout_v47.py"
      - "tests/test_residual_momentum_breakout_v47_exact.py"
      - ".github/workflows/v47-residual-momentum.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  verify-and-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile research modules
        run: |
          python -m py_compile \
            src/tradebot/research/distributional_utility_v43.py \
            src/tradebot/research/yield_bearing_cash_v44.py \
            src/tradebot/research/yield_bearing_cash_v44_reproduce.py \
            src/tradebot/research/residual_momentum_breakout_v47.py \
            src/tradebot/research/residual_momentum_breakout_v47_exact.py
      - name: Focused invariant tests
        run: |
          python -m pytest -q \
            tests/test_distributional_utility_v43.py \
            tests/test_yield_bearing_cash_v44.py \
            tests/test_yield_bearing_cash_v44_reproduce.py \
            tests/test_residual_momentum_breakout_v47.py \
            tests/test_residual_momentum_breakout_v47_exact.py
      - name: Reproduce frozen v4.3 baseline
        run: |
          mkdir -p evidence/v43 evidence/v47
          tradebot-v43-distributional-utility \
            --json-out evidence/v43/historical.json \
            --bundle-out evidence/v43/bundle.joblib \
            --monthly-workers 8 \
            --metrics-workers 16
      - name: Run v4.7 blocked selection and sealed evaluation
        run: |
          tradebot-v47-residual-momentum \
            --baseline-json evidence/v43/historical.json \
            --bundle evidence/v43/bundle.joblib \
            --json-out evidence/v47/historical.json \
            --monthly-workers 8 \
            --metrics-workers 16
      - name: Validate v4.7 evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("evidence/v47/historical.json").read_text())
          selection = report["selection"]
          evaluation = report["evaluation"]
          reproduction = report["reproduction"]

          assert report["paper_only"] is True
          assert report["authorizes_trading"] is False
          assert report["authorizes_shadow_paper"] is True
          assert report["retrospective"] is True
          assert report["untouched_historical_dates"] is False
          assert reproduction["source_inventory_exact"] is True
          assert reproduction["dataset_metadata_exact"] is True
          assert reproduction["bundle_summary_exact"] is True
          assert reproduction["v43_evaluation_exact"] is True
          assert reproduction["v43_retrained_for_v47"] is False
          assert selection["candidate_count"] == 324
          assert len(selection["selected_folds"]) == 6
          assert report["cash_source"]["series"] == "DGS3MO"
          assert report["cash_source"]["first_date"] <= "2022-01-03"
          assert report["cash_source"]["last_date"] >= "2026-06-30"
          assert report["residual_dataset"]["verification_alignment"] == "exact-frozen-v43-decision-dates"
          assert evaluation["verification_days"] == 265
          assert evaluation["status"] in {
              "RETROSPECTIVE_NOT_YET_BREAKTHROUGH",
              "RETROSPECTIVE_HISTORICAL_BREAKTHROUGH_PENDING_REPLICATION_AND_SMOKE",
          }

          print(json.dumps({
              "status": evaluation["status"],
              "selected_config": selection["selected_config"],
              "selected_eligible": selection["selected_eligible"],
              "eligible_candidate_count": selection["eligible_candidate_count"],
              "fold_standard_returns": selection["selected_diagnostics"]["standard_returns"],
              "fold_stress_returns": selection["selected_diagnostics"]["stress_returns"],
              "standard_return": evaluation["aggregate_standard_return"],
              "stress_return": evaluation["aggregate_stress_return"],
              "annualized_standard_return": evaluation["annualized_standard_return"],
              "maximum_drawdown": evaluation["maximum_drawdown"],
              "standard_windows": evaluation["standard_window_returns"],
              "mean_v44_daily_return_correlation": evaluation["mean_v44_daily_return_correlation"],
              "selected_assets": evaluation["selected_assets"],
              "report_sha256": report["report_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload v4.7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v47-residual-momentum-${{ github.run_id }}
          path: |
            evidence/v43/historical.json
            evidence/v43/bundle.joblib
            evidence/v47/historical.json
          retention-days: 90
