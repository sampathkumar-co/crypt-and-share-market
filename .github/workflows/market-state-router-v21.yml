name: Forward Market-State Router v2.1

on:
  workflow_dispatch:
  schedule:
    - cron: "42 * * * *"
  pull_request:
    paths:
      - ".github/workflows/market-state-router-v21.yml"
      - ".github/workflows/forward-market-state-v20.yml"
      - "research/V21_MARKET_STATE_ROUTER_PROTOCOL.md"
      - "src/tradebot/research/market_state_router.py"
      - "tests/test_market_state_router.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: market-state-router-v21-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and run frozen synthetic gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_market_state_router.py -q

  assemble-and-decide:
    if: github.event_name != 'pull_request'
    needs: test-router
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          mkdir -p evidence/router-history evidence/router-decision

      - name: Assemble normalized forward history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin forward-data/v2
          rm -rf /tmp/forward-data-v2
          git worktree add --detach /tmp/forward-data-v2 origin/forward-data/v2
          source_dir=/tmp/forward-data-v2/data/forward-market-state/normalized
          test -d "$source_dir"
          cp "$source_dir"/*.json evidence/router-history/
          FORWARD_DATA_HEAD=$(git -C /tmp/forward-data-v2 rev-parse HEAD)
          export FORWARD_DATA_HEAD
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          history = Path("evidence/router-history")
          files = sorted(history.glob("*.json"))
          if not files:
              raise SystemExit("No normalized v2.0 forward snapshots are available yet")
          inventory = [
              {
                  "snapshot_file": path.name,
                  "snapshot_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in files
          ]
          Path("evidence/router-decision/history_inventory.json").write_text(
              json.dumps({
                  "forward_data_branch": "forward-data/v2",
                  "forward_data_head": os.environ["FORWARD_DATA_HEAD"],
                  "snapshot_files": len(files),
                  "snapshots": inventory,
              }, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "forward_data_head": os.environ["FORWARD_DATA_HEAD"],
              "snapshot_files": len(files),
          }, indent=2))
          PY
      - name: Evaluate research-only router
        run: |
          tradebot-market-state-router \
            --folder evidence/router-history \
            --json-out evidence/router-decision/market_state_router.json

      - name: Validate fail-closed decision
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("evidence/router-decision/market_state_router.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["schema_version"] == "2.1"
          assert report["paper_only"] is True
          assert report["authorizes_trading"] is False
          assert report["candidate_state"] in {"CASH", "RESEARCH_CANDIDATES"}
          assert len(report["selected_candidates"]) <= 2
          assert report["minimum_cash_weight"] >= 0.50
          assert sum(report["target_weights"].values()) <= 0.50 + 1e-12
          assert all(weight <= 0.25 + 1e-12 for weight in report["target_weights"].values())

          canonical = dict(report)
          expected = canonical.pop("report_sha256")
          encoded = json.dumps(canonical, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == expected

          if report["input_snapshot_count"] < 169:
              assert report["candidate_state"] == "CASH"
              assert report["decision_reason"] == "insufficient_contiguous_forward_history"
              assert report["target_weights"] == {}
              assert report["minimum_cash_weight"] == 1.0
          print(json.dumps({
              "state": report["candidate_state"],
              "reason": report["decision_reason"],
              "snapshots": report["input_snapshot_count"],
              "selected": report["selected_candidates"],
              "minimum_cash_weight": report["minimum_cash_weight"],
              "report_sha256": expected,
          }, indent=2))
          PY

      - name: Upload research decision evidence
        uses: actions/upload-artifact@v4
        with:
          name: market-state-router-v21-${{ github.run_id }}
          path: evidence/router-decision/
          retention-days: 90
          if-no-files-found: error

  persist-router-decision:
    if: github.event_name != 'pull_request'
    needs: assemble-and-decide
    runs-on: ubuntu-latest
    concurrency:
      group: forward-data-v2-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download router decision evidence
        uses: actions/download-artifact@v4
        with:
          name: market-state-router-v21-${{ github.run_id }}
          path: evidence/router-decision

      - name: Append decision and inventory
        shell: bash
        run: |
          set -euo pipefail
          stem=$(python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          report = json.loads(Path("evidence/router-decision/market_state_router.json").read_text())
          cutoff = datetime.fromisoformat(report["data_cutoff_utc"].replace("Z", "+00:00"))
          print(cutoff.strftime("%Y%m%dT%H0000Z"))
          PY
          )
          git fetch origin forward-data/v2
          rm -rf /tmp/forward-data-v2
          git worktree add --detach /tmp/forward-data-v2 origin/forward-data/v2
          mkdir -p /tmp/forward-data-v2/data/market-state-router/decisions
          mkdir -p /tmp/forward-data-v2/data/market-state-router/inventories

          decision_source="evidence/router-decision/market_state_router.json"
          inventory_source="evidence/router-decision/history_inventory.json"
          decision_target="/tmp/forward-data-v2/data/market-state-router/decisions/${stem}.json"
          inventory_target="/tmp/forward-data-v2/data/market-state-router/inventories/${stem}.json"
          snapshot_root="/tmp/forward-data-v2/data/forward-market-state/normalized"

          if [ -e "$decision_target" ]; then
            cmp --silent "$decision_source" "$decision_target" || {
              echo "Refusing to replace a different same-hour v2.1 decision: $decision_target" >&2
              exit 1
            }
            test -e "$inventory_target" || {
              echo "Existing v2.1 decision has no preserved inventory: $stem" >&2
              exit 1
            }
            python - "$decision_target" "$inventory_target" "$snapshot_root" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          decision_path = Path(sys.argv[1])
          inventory_path = Path(sys.argv[2])
          snapshot_root = Path(sys.argv[3])
          decision = json.loads(decision_path.read_text(encoding="utf-8"))
          inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          assert decision["paper_only"] is True
          assert decision["authorizes_trading"] is False
          assert inventory["forward_data_branch"] == "forward-data/v2"
          assert isinstance(inventory["forward_data_head"], str) and len(inventory["forward_data_head"]) == 40
          snapshots = inventory["snapshots"]
          assert inventory["snapshot_files"] == len(snapshots)
          by_name = {item["snapshot_file"]: item for item in snapshots}
          assert len(by_name) == len(snapshots)
          for name, item in by_name.items():
              path = snapshot_root / name
              assert path.is_file(), path
              expected = item["snapshot_sha256"]
              assert isinstance(expected, str) and len(expected) == 64
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          required = {f"{item['snapshot_id']}.json" for item in decision["input_snapshots"]}
          assert required.issubset(by_name)
          PY
            echo "Identical same-hour v2.1 decision already preserved; retaining its first hash-verified inventory."
            exit 0
          fi

          if [ -e "$inventory_target" ]; then
            echo "Refusing orphaned same-hour v2.1 inventory: $inventory_target" >&2
            exit 1
          fi
          cp "$decision_source" "$decision_target"
          cp "$inventory_source" "$inventory_target"

          git -C /tmp/forward-data-v2 config user.name "github-actions[bot]"
          git -C /tmp/forward-data-v2 config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/forward-data-v2 add data/market-state-router
          if git -C /tmp/forward-data-v2 diff --cached --quiet; then
            echo "Router decision already preserved byte-for-byte."
            exit 0
          fi
          git -C /tmp/forward-data-v2 commit -m "Append v2.1 router decision $stem"
          git -C /tmp/forward-data-v2 pull --rebase origin forward-data/v2
          git -C /tmp/forward-data-v2 push origin HEAD:forward-data/v2
