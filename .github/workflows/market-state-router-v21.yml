name: Forward Market-State Router v2.1

on:
  workflow_dispatch:
  schedule:
    - cron: "42 * * * *"
  pull_request:
    paths:
      - ".github/workflows/market-state-router-v21.yml"
      - ".github/workflows/forward-market-state-v20.yml"
      - "research/V21_MARKET_STATE_ROUTER_PROTOCOL.md"
      - "src/tradebot/research/market_state_router.py"
      - "tests/test_market_state_router.py"
      - "pyproject.toml"

permissions:
  contents: read
  actions: read

concurrency:
  group: market-state-router-v21-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and run frozen synthetic gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_market_state_router.py -q

  assemble-and-decide:
    if: github.event_name != 'pull_request'
    needs: test-router
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          mkdir -p evidence/router-history evidence/router-decision

      - name: Assemble normalized forward history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "tradebot-forward-router-v21",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api_request(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  return response.read()

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          def download_archive(url):
              opener = urllib.request.build_opener(NoRedirect)
              request = urllib.request.Request(url, headers=headers)
              try:
                  response = opener.open(request, timeout=30)
              except urllib.error.HTTPError as exc:
                  if exc.code not in {301, 302, 303, 307, 308}:
                      raise
                  location = exc.headers.get("Location")
              else:
                  location = response.headers.get("Location")
                  if location is None:
                      return response.read()
              if not location:
                  raise RuntimeError("Artifact API redirect did not include Location")
              blob_headers = {"User-Agent": headers["User-Agent"]}
              with urllib.request.urlopen(
                  urllib.request.Request(location, headers=blob_headers), timeout=30
              ) as response:
                  return response.read()

          artifacts = []
          for page in range(1, 11):
              payload = json.loads(api_request(
                  f"https://api.github.com/repos/{repository}/actions/artifacts?per_page=100&page={page}"
              ))
              batch = payload.get("artifacts", [])
              if not batch:
                  break
              artifacts.extend(
                  item for item in batch
                  if not item.get("expired")
                  and str(item.get("name", "")).startswith("forward-market-state-v20-normalized-")
              )

          artifacts.sort(key=lambda item: (item.get("created_at", ""), int(item["id"])))
          artifacts = artifacts[-240:]
          history = Path("evidence/router-history")
          inventory = []
          for artifact in artifacts:
              archive = download_archive(artifact["archive_download_url"])
              archive_sha = hashlib.sha256(archive).hexdigest()
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  names = [name for name in bundle.namelist() if name.endswith(".json")]
                  if len(names) != 1:
                      raise AssertionError((artifact["id"], names))
                  content = bundle.read(names[0])
              target = history / Path(names[0]).name
              if target.exists() and target.read_bytes() != content:
                  raise AssertionError(f"Conflicting normalized snapshot: {target.name}")
              target.write_bytes(content)
              inventory.append({
                  "artifact_id": artifact["id"],
                  "name": artifact["name"],
                  "created_at": artifact.get("created_at"),
                  "archive_sha256": archive_sha,
                  "snapshot_file": target.name,
                  "snapshot_sha256": hashlib.sha256(content).hexdigest(),
              })

          Path("evidence/router-decision/history_inventory.json").write_text(
              json.dumps({"artifacts": inventory, "snapshot_files": len(list(history.glob('*.json')))}, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({"artifacts": len(inventory), "snapshot_files": len(list(history.glob('*.json')))}, indent=2))
          if not list(history.glob("*.json")):
              raise SystemExit("No normalized v2.0 forward snapshots are available yet")
          PY

      - name: Evaluate research-only router
        run: |
          tradebot-market-state-router \
            --folder evidence/router-history \
            --json-out evidence/router-decision/market_state_router.json

      - name: Validate fail-closed decision
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("evidence/router-decision/market_state_router.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["schema_version"] == "2.1"
          assert report["paper_only"] is True
          assert report["authorizes_trading"] is False
          assert report["candidate_state"] in {"CASH", "RESEARCH_CANDIDATES"}
          assert len(report["selected_candidates"]) <= 2
          assert report["minimum_cash_weight"] >= 0.50
          assert sum(report["target_weights"].values()) <= 0.50 + 1e-12
          assert all(weight <= 0.25 + 1e-12 for weight in report["target_weights"].values())

          canonical = dict(report)
          expected = canonical.pop("report_sha256")
          encoded = json.dumps(canonical, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          assert hashlib.sha256(encoded).hexdigest() == expected

          if report["input_snapshot_count"] < 169:
              assert report["candidate_state"] == "CASH"
              assert report["decision_reason"] == "insufficient_contiguous_forward_history"
              assert report["target_weights"] == {}
              assert report["minimum_cash_weight"] == 1.0
          print(json.dumps({
              "state": report["candidate_state"],
              "reason": report["decision_reason"],
              "snapshots": report["input_snapshot_count"],
              "selected": report["selected_candidates"],
              "minimum_cash_weight": report["minimum_cash_weight"],
              "report_sha256": expected,
          }, indent=2))
          PY

      - name: Upload research decision evidence
        uses: actions/upload-artifact@v4
        with:
          name: market-state-router-v21-${{ github.run_id }}
          path: evidence/router-decision/
          retention-days: 90
          if-no-files-found: error
