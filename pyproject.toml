[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-market-ai-bot"
version = "0.4.0"
description = "Paper-only crypto and Indian equity strategy research platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Repository = "https://github.com/sampathkumar-co/crypt-and-share-market"
Issues = "https://github.com/sampathkumar-co/crypt-and-share-market/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tradebot = "tradebot.cli:main"
tradebot-profit-quality = "tradebot.backtest.profit_quality_gate:main"
tradebot-meta-allocation = "tradebot.backtest.meta_allocation:main"
tradebot-combined-ablation = "tradebot.backtest.combined_ablation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
