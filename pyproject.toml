[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-market-ai-bot"
version = "0.4.1"
description = "Paper-only crypto and Indian equity strategy research platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Repository = "https://github.com/sampathkumar-co/crypt-and-share-market"
Issues = "https://github.com/sampathkumar-co/crypt-and-share-market/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "joblib>=1.2"]
ml = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2", "joblib>=1.2"]

[project.scripts]
tradebot = "tradebot.cli:main"
tradebot-forward-state = "tradebot.data.forward_market_state:main"
tradebot-market-state-router = "tradebot.research.market_state_router:main"
tradebot-forward-paper-eval = "tradebot.research.forward_paper_evaluation:main"
tradebot-forward-alpha = "tradebot.research.forward_alpha_candidates:main"
tradebot-forward-alpha-v25 = "tradebot.research.forward_alpha_v25:main"
tradebot-forward-alpha-v25-readiness = "tradebot.research.forward_alpha_v25_readiness:main"
tradebot-forward-alpha-readiness = "tradebot.research.forward_alpha_readiness:main"
tradebot-v25-historical-proxy-screen = "tradebot.research.historical_proxy_screen_v25:main"
tradebot-v26-historical-discovery = "tradebot.research.historical_discovery_v26:main"
tradebot-v27-fivefold-discovery = "tradebot.research.historical_discovery_v27_runner:main"
tradebot-v28-historical-rotation = "tradebot.research.historical_rotation_v28_runner:main"
tradebot-v29-trend-rotation = "tradebot.research.historical_trend_rotation_v29:main"
tradebot-v30-monthly-ensemble = "tradebot.research.historical_monthly_ensemble_v30_runner:main"
tradebot-v31-yield-trend = "tradebot.research.historical_yield_trend_v31_runner:main"
tradebot-v312-scheduled-integrity = "tradebot.research.historical_yield_trend_integrity_v312:main"
tradebot-v32-coinbase-replication = "tradebot.research.historical_coinbase_replication_v32:main"
tradebot-v33-forward-observation = "tradebot.research.forward_yield_trend_v33:main"
tradebot-v33-forward-readiness = "tradebot.research.forward_yield_trend_v33_readiness:main"
tradebot-v41-daily-learned = "tradebot.research.learned_daily_multihorizon_v41:main"
tradebot-v41-shadow-smoke = "tradebot.research.shadow_daily_v41:main"
tradebot-v42-regime-ranking = "tradebot.research.regime_ranking_v42:main"
tradebot-v43-distributional-utility = "tradebot.research.distributional_utility_v43:main"
tradebot-v44-yield-cash = "tradebot.research.yield_bearing_cash_v44_reproduce:main"
tradebot-v44-yield-cash-fresh = "tradebot.research.yield_bearing_cash_v44:main"
tradebot-v45-regime-diversified = "tradebot.research.regime_diversified_utility_v45:main"
tradebot-v46-selective-veto = "tradebot.research.walk_forward_selective_veto_v46:main"
tradebot-v47-macro-liquidity = "tradebot.research.macro_liquidity_state_v47_runner:main"
tradebot-v48-dollar-rates = "tradebot.research.dollar_rates_attenuation_v48:main"
tradebot-v49-dollar-rates-shock = "tradebot.research.dollar_rates_probability_shock_v49:main"
tradebot-v50-fresh-transition = "tradebot.research.fresh_macro_transition_v50:main"
tradebot-v51-consensus-transition = "tradebot.research.consensus_transition_threshold_v51:main"
tradebot-v52-alpha-funnel = "tradebot.research.adversarial_alpha_funnel_v52:main"
tradebot-v53-untouched-replication = "tradebot.research.untouched_replication_v53:main"
tradebot-v54-july-forward-smoke = "tradebot.research.july_forward_smoke_v54:main"
tradebot-v542-forward-tail = "tradebot.research.forward_tail_integrity_v542:main"
tradebot-v55-coinbase-execution = "tradebot.research.coinbase_execution_replication_v55:main"
tradebot-v56-cost-aware-paper-hour = "tradebot.research.cost_aware_paper_hour_v56:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
